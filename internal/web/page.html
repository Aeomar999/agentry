<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentry</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  :root {
    --page: #f6f6f4; --panel: #ffffff; --line: #deded8; --ink: #1d1f22; --muted: #6a6f76;
    --accent: #2a5bd7; --working: #2a5bd7; --needs: #b45309; --done: #15803d; --deny: #b91c1c;
    --code: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #121417; --panel: #1a1d21; --line: #2c3036; --ink: #e7e9ec; --muted: #9aa1ab;
      --accent: #7aa2ff; --working: #7aa2ff; --needs: #f0a64b; --done: #4ade80; --deny: #f87171;
      --code: #22262b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  main > div { min-width: 0; } /* let wide tables scroll inside their box instead of widening the page */
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 20px; min-width: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 14px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); cursor: pointer; }
  button.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
  button.deny { background: transparent; color: var(--deny); border-color: var(--deny); }
  button:disabled { opacity: .5; cursor: wait; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .error { color: var(--deny); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  ul.tasks { list-style: none; margin: 0; padding: 0; }
  ul.tasks li { padding: 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  ul.tasks li:hover { background: var(--page); }
  ul.tasks li.selected { border-color: var(--accent); }
  .title { font-weight: 600; overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.working { color: var(--working); } .badge.needs { color: var(--needs); } .badge.done { color: var(--done); }
  .needs-box { border: 1px solid var(--needs); border-radius: 8px; padding: 12px; margin: 12px 0; }
  .needs-box h3 { color: var(--needs); margin-top: 0; }
  code, pre { font-family: ui-monospace, monospace; font-size: 13px; background: var(--code); border-radius: 4px; }
  code { padding: 1px 5px; overflow-wrap: anywhere; }
  pre { padding: 10px; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; }
  ol.trail { margin: 0; padding-left: 22px; }
  ol.trail li { margin-bottom: 12px; }
  .who { font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td code { white-space: pre-wrap; }
  /* Short columns (position, type, actor, agent, tool, decision) never wrap;
     the long one (data, command) takes the rest of the width and wraps. */
  td.short, td.short code { white-space: nowrap; overflow-wrap: normal; }
  td.long { width: 100%; min-width: 220px; }
  .scroll { overflow-x: auto; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .agent { border-top: 1px solid var(--line); padding: 10px 0; }
  .agent:first-of-type { border-top: 0; }
  #terminal-slot:empty { display: none; }
  .terminal { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 16px 0; }
  .terminal-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .terminal-screen { background: #000; padding: 6px; overflow-x: auto; }
</style>
</head>
<body>
<header><h1>Agentry</h1><span id="connection">connecting…</span></header>
<main>
  <div>
    <section>
      <h2>New task</h2>
      <form id="new-task">
        <label for="title">What should be done</label>
        <input id="title" required placeholder="Remove the TODO comments in src/">
        <label for="description">Details (optional)</label>
        <textarea id="description" placeholder="Anything the coordinator should know"></textarea>
        <label for="repo">Repository</label>
        <input id="repo" placeholder="">
        <div class="row"><button type="submit">Add task</button></div>
        <div class="error" id="new-task-error"></div>
      </form>
    </section>
    <section>
      <h2>Tasks</h2>
      <ul class="tasks" id="task-list"></ul>
      <p class="muted" id="no-tasks">No tasks yet.</p>
    </section>
  </div>
  <div>
    <section id="task-panel"><p class="muted">Pick a task, or add one.</p></section>
    <section>
      <h2>Agents</h2>
      <div id="agent-list"></div>
    </section>
    <section>
      <h2>Policy</h2>
      <div id="policy"></div>
    </section>
  </div>
</main>

<!-- The live terminal needs xterm.js; without it the page still works, minus the terminal. -->
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script>
  // ---- talking to the server ------------------------------------------------

  // The token from the printed link, kept by the page and sent on every call.
  // It is taken out of the address bar so it isn't shared by accident.
  const token = (() => {
    const fromLink = new URLSearchParams(location.search).get("token");
    try {
      if (fromLink) localStorage.setItem("agentry-token", fromLink);
      return fromLink || localStorage.getItem("agentry-token") || "";
    } catch { return fromLink || ""; }
  })();
  if (location.search) history.replaceState(null, "", location.pathname + location.hash);

  async function api(method, path, body) {
    const response = await fetch(path, {
      method, headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (response.status === 401) throw new Error("Not signed in: open the link `agentry serve` printed.");
    if (!response.ok) throw new Error((await response.text()).trim());
    return response.json();
  }

  // ---- building the page ----------------------------------------------------

  // el("p", {class: "muted"}, "text", child): an element. Text is always set as
  // text, never as HTML, so nothing an agent writes can run on this page.
  function el(tag, attributes = {}, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attributes)) {
      if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
      else node.setAttribute(name, value);
    }
    for (const child of children.flat()) {
      if (child !== null && child !== undefined) node.append(child instanceof Node ? child : String(child));
    }
    return node;
  }

  const statusClass = { "working": "working", "needs you": "needs", "done": "done" };
  const badge = (status) => el("span", { class: "badge " + statusClass[status] }, status);
  const when = (iso) => new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  function describe(task) {
    if (task.status === "done") return "done";
    if (task.status === "needs you") return task.needsYou;
    return task.currentAgent ? task.currentAgent + " is working" : "the coordinator is next";
  }

  // ---- the task list --------------------------------------------------------

  let selected = location.hash.slice(1);

  function renderTaskList(tasks) {
    document.getElementById("no-tasks").hidden = tasks.length > 0;
    document.getElementById("task-list").replaceChildren(...tasks.map((task) =>
      el("li", { class: task.id === selected ? "selected" : "", onclick: () => select(task.id) },
        el("div", { class: "title" }, task.title),
        el("div", { class: "row", style: "margin-top:4px;align-items:center" },
          badge(task.status), el("span", { class: "muted" }, task.id + " · " + describe(task).slice(0, 80))))));
  }

  function select(id) {
    selected = id;
    location.hash = id;
    refresh();
  }

  // ---- one task -------------------------------------------------------------

  function renderTask(task) {
    const w = task.worktree;
    const parts = [
      el("h2", {}, task.title, " ", badge(task.status)),
      el("p", { class: "muted" }, task.id, " · ", task.repo,
        w ? [" · branch ", el("code", {}, w.branch), " · port ", w.port] : " · setting up the worktree"),
      task.description ? el("p", {}, task.description) : null,
      renderNeedsYou(task),
      task.status === "done" ? el("p", {}, el("strong", {}, "Done: "), task.summary) : null,
      el("div", { id: "terminal-slot" }),
      el("h3", {}, "Handoffs"),
      el("ol", { class: "trail" }, (task.trail || []).map((step) =>
        el("li", {},
          el("span", { class: "who" }, step.from, " → ", step.to), " ", el("span", { class: "muted" }, when(step.at)),
          el("pre", {}, step.text)))),
      renderActions(task.actions || []),
      el("details", {}, el("summary", {}, "Every event (" + (task.events || []).length + ")"),
        el("div", { class: "scroll" }, el("table", {}, (task.events || []).map((e) =>
          el("tr", {}, el("td", { class: "short" }, e.position), el("td", { class: "short" }, el("code", {}, e.type)),
            el("td", { class: "short" }, e.actor), el("td", { class: "long" }, el("code", {}, JSON.stringify(e.data || {}))))))))
    ];
    document.getElementById("task-panel").replaceChildren(...parts.filter(Boolean));
    window.onTaskRendered?.(task); // the terminal panel hooks in here
  }

  function renderNeedsYou(task) {
    const approvals = (task.approvals || []).map((action) =>
      el("div", { style: "margin-bottom:12px" },
        el("div", {}, el("span", { class: "who" }, action.agent), " asks to run (", action.tool, "):"),
        el("pre", {}, action.command),
        el("div", { class: "muted" }, "Rule: ", action.reason),
        el("div", { class: "row" },
          el("button", { onclick: (e) => decide(e, task.id, action.id, "approve") }, "Approve"),
          el("button", { class: "deny", onclick: (e) => decide(e, task.id, action.id, "deny") }, "Deny"))));

    const question = task.status === "needs you" && approvals.length === 0 ? task.needsYou : "";
    if (approvals.length === 0 && !question) return null;
    const answer = el("textarea", { placeholder: "Your answer goes to the coordinator" });
    const isQuestionForAnswer = task.trail?.length && task.trail[task.trail.length - 1].to === "you";
    return el("div", { class: "needs-box" },
      el("h3", {}, "Needs you"),
      approvals,
      question ? el("p", { style: "white-space:pre-wrap" }, question) : null,
      question && isQuestionForAnswer ? [answer, el("div", { class: "row" },
        el("button", { onclick: (e) => answerTask(e, task.id, answer.value) }, "Answer"))] : null,
      question && !isQuestionForAnswer ? el("p", { class: "muted" }, "Open the agent's terminal to see what it is waiting for.") : null,
      el("div", { class: "error", id: "needs-error" }));
  }

  function renderActions(actions) {
    if (actions.length === 0) return null;
    return el("details", {}, el("summary", {}, "Actions the agents took (" + actions.length + ")"),
      el("div", { class: "scroll" }, el("table", {},
        el("tr", {}, el("th", {}, "agent"), el("th", {}, "tool"), el("th", {}, "command"), el("th", {}, "decision")),
        actions.map((a) => el("tr", {},
          el("td", { class: "short" }, a.agent), el("td", { class: "short" }, a.tool), el("td", { class: "long" }, el("code", {}, a.command)),
          el("td", {}, a.decision || (a.asked ? "waiting for you" : "deciding"), a.reason ? el("div", { class: "muted" }, a.reason) : null))))));
  }

  async function decide(event, task, action, verdict) {
    await whileBusy(event.target, () => api("POST", `/api/tasks/${task}/actions/${encodeURIComponent(action)}/${verdict}`, { reason: "decided on the page" }));
  }

  async function answerTask(event, task, answer) {
    if (!answer.trim()) return;
    await whileBusy(event.target, () => api("POST", `/api/tasks/${task}/answer`, { answer }));
  }

  async function whileBusy(button, work) {
    button.disabled = true;
    try { await work(); await refresh(); }
    catch (error) { const box = document.getElementById("needs-error"); if (box) box.textContent = error.message; }
    finally { button.disabled = false; }
  }

  // ---- the live terminal ----------------------------------------------------

  // One terminal, kept across redraws: the page redraws the task on every
  // change, so the terminal's element is moved into the new slot, not rebuilt.
  // Watching by default; Take control types into the agent's session, and
  // the server drops keys from anyone not in control (proof 04).
  const live = { task: null, socket: null, term: null, node: null, state: {} };

  window.onTaskRendered = (task) => {
    const working = Boolean(task.currentAgent) && window.Terminal;
    if (!working) { closeTerminal(); return; }
    if (live.task !== task.id || !live.socket || live.socket.readyState > WebSocket.OPEN) openTerminal(task);
    document.getElementById("terminal-slot").replaceChildren(live.node);
  };

  function openTerminal(task) {
    closeTerminal();
    live.task = task.id;
    live.term = new Terminal({ cols: 120, rows: 36, fontSize: 13, cursorBlink: true, convertEol: false });
    const screen = el("div", { class: "terminal-screen" });
    const status = el("span", { class: "muted" }, "connecting…");
    const toggle = el("button", { class: "quiet", disabled: "" }, "Take control");
    live.node = el("div", { class: "terminal" },
      el("div", { class: "terminal-bar" }, el("span", { class: "who" }, task.currentAgent, "'s terminal"), status, toggle), screen);
    live.term.open(screen);

    const scheme = location.protocol === "https:" ? "wss://" : "ws://";
    const socket = new WebSocket(scheme + location.host + "/api/tasks/" + task.id + "/terminal?token=" + encodeURIComponent(token));
    socket.binaryType = "arraybuffer";
    live.socket = socket;
    socket.onmessage = (message) => {
      if (typeof message.data !== "string") { live.term.write(new Uint8Array(message.data)); return; }
      live.state = JSON.parse(message.data);
      const mine = live.state.controller === live.state.you, someoneElse = live.state.controller && !mine;
      status.textContent = mine ? "you have control: typing goes to the agent" : someoneElse ? "someone else has control" : "watching";
      toggle.textContent = mine ? "Hand back" : "Take control";
      toggle.disabled = someoneElse;
      if (mine) live.term.focus();
    };
    socket.onclose = () => { if (live.socket === socket) status.textContent = "session ended"; };
    const encoder = new TextEncoder();
    live.term.onData((keys) => socket.readyState === WebSocket.OPEN && socket.send(encoder.encode(keys)));
    toggle.onclick = () => socket.send(JSON.stringify({ type: live.state.controller === live.state.you ? "release" : "take" }));
  }

  function closeTerminal() {
    if (live.socket) { const old = live.socket; live.socket = null; old.close(); }
    live.term?.dispose();
    Object.assign(live, { task: null, term: null, node: null, state: {} });
  }

  // ---- agents ---------------------------------------------------------------

  function renderAgents(agents) {
    document.getElementById("agent-list").replaceChildren(...agents.map((agent) =>
      el("div", { class: "agent" },
        el("div", {}, el("span", { class: "who" }, agent.name), " ",
          el("span", { class: "muted" }, agent.coordinates ? "coordinator · " : "", agent.engine, agent.model ? " · " + agent.model : "",
            " · policy: ", agent.profile || "default")),
        el("div", {}, agent.description),
        el("details", {}, el("summary", {}, "Prompt"), el("pre", {}, agent.prompt)))));
  }

  // ---- policy ---------------------------------------------------------------

  // The policy in force, read from policy.toml. Edit the file; saving it
  // reloads it, and a file with an error is refused and shown here.
  function renderPolicy(p) {
    document.getElementById("policy").replaceChildren(
      el("p", { class: "muted" }, "From ", el("code", {}, p.path), ". Edit the file and save: it reloads on its own."),
      p.problem ? el("div", { class: "needs-box" }, el("h3", {}, "The file has an error, so the policy before it is still in force"),
        el("pre", {}, p.problem)) : null,
      p.profiles.map((profile) => el("div", { class: "agent" },
        el("div", {}, el("span", { class: "who" }, profile.name), " ", el("span", { class: "muted" }, "otherwise: ", profile.otherwise)),
        el("div", {}, profile.why),
        profile.rules.length ? el("details", {}, el("summary", {}, profile.rules.length + " rules"),
          el("div", { class: "scroll" }, el("table", {}, profile.rules.map((rule) =>
            el("tr", {}, el("td", {}, rule.decision), el("td", {}, el("strong", {}, rule.name), el("div", { class: "muted" }, rule.why))))))) : null)),
      el("details", {}, el("summary", {}, "The whole file"), el("pre", {}, p.text)));
  }

  // ---- new task -------------------------------------------------------------

  document.getElementById("new-task").addEventListener("submit", async (event) => {
    event.preventDefault();
    const field = (id) => document.getElementById(id);
    const error = field("new-task-error");
    error.textContent = "";
    try {
      const created = await api("POST", "/api/tasks", {
        title: field("title").value, description: field("description").value, repo: field("repo").value,
      });
      field("title").value = field("description").value = "";
      select(created.stream);
    } catch (e) { error.textContent = e.message; }
  });

  // ---- staying live ---------------------------------------------------------

  async function refresh() {
    api("GET", "/api/policy").then(renderPolicy).catch(() => {});
    const tasks = await api("GET", "/api/tasks");
    renderTaskList(tasks);
    if (selected && tasks.some((t) => t.id === selected)) renderTask(await api("GET", "/api/tasks/" + selected));
  }

  // Long-poll: the server answers when the log moves (or after 25 s), then we redraw.
  async function stayLive() {
    let position = 0;
    const connection = document.getElementById("connection");
    for (;;) {
      try {
        const change = await api("GET", "/api/changes?after=" + position);
        if (change.position !== position) {
          position = change.position;
          await refresh();
        }
        connection.textContent = "live";
      } catch (error) {
        connection.textContent = error.message.startsWith("Not signed in") ? error.message : "reconnecting…";
        await new Promise((resume) => setTimeout(resume, 2000));
      }
    }
  }

  async function start() {
    try {
      const config = await api("GET", "/api/config");
      document.getElementById("repo").placeholder = config.defaultRepo;
      renderAgents(await api("GET", "/api/agents"));
    } catch (error) {
      document.getElementById("connection").textContent = error.message;
    }
    stayLive();
  }
  start();
</script>
</body>
</html>
