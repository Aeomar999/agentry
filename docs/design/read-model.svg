<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The read model"><title>The read model</title><defs><marker id="a-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="640" rx="8" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="638.5" rx="7.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">The read model</text><text x="48" y="114" font-size="15" fill="#62615c">Every write goes through Propose; readers see an event only once its state is applied in memory.</text><rect x="48" y="150" width="760" height="250" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="68" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">STORE.PROPOSE, ONE AT A TIME</text><rect x="68" y="190" width="168" height="84" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="86" y="219.0" font-size="15.5" font-weight="650" fill="#1c1c1b">1  Check</text><text x="86" y="239.0" font-size="12.5" fill="#62615c">rules.Check reads</text><text x="86" y="257.0" font-size="12.5" fill="#62615c">current.State</text><rect x="252" y="190" width="168" height="84" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="270" y="219.0" font-size="15.5" font-weight="650" fill="#1c1c1b">2  Append</text><text x="270" y="239.0" font-size="12.5" fill="#62615c">INSERT in the</text><text x="270" y="257.0" font-size="12.5" fill="#62615c">transaction</text><rect x="436" y="190" width="168" height="84" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="454" y="219.0" font-size="15.5" font-weight="650" fill="#1c1c1b">3  Commit</text><text x="454" y="239.0" font-size="12.5" fill="#62615c">the event is</text><text x="454" y="257.0" font-size="12.5" fill="#62615c">in the log</text><rect x="620" y="190" width="168" height="84" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="638" y="219.0" font-size="15.5" font-weight="650" fill="#1c1c1b">4  Apply</text><text x="638" y="239.0" font-size="12.5" fill="#62615c">its stored form</text><text x="638" y="257.0" font-size="12.5" fill="#62615c">to current.State</text><path d="M238,232 H250" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M422,232 H434" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M606,232 H618" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="68" y="300" width="352" height="76" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.55" stroke-width="1.2"/><text x="86" y="325.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Refused or rolled back</text><text x="86" y="345.0" font-size="12.5" fill="#62615c">a refusal stores proposal.rejected, which no</text><text x="86" y="363.0" font-size="12.5" fill="#62615c">state reads; a failed commit applies nothing</text><rect x="436" y="300" width="352" height="76" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="454" y="325.0" font-size="15.5" font-weight="650" fill="#1c1c1b">5  Mark applied, notify</text><text x="454" y="345.0" font-size="12.5" fill="#62615c">applied = its position; reads of the log</text><text x="454" y="363.0" font-size="12.5" fill="#62615c">stop there, so none sees it before its state</text><path d="M704,278 V296" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M860.0,184 V272 A120.0,14 0 0 0 1100.0,272 V184" fill="#ffffff" stroke="#2f8f8f" stroke-width="1.4"/><ellipse cx="980" cy="184" rx="120.0" ry="14" fill="#e4f1f1" stroke="#2f8f8f" stroke-width="1.4"/><text x="980" y="228" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1c1b">The log</text><text x="980" y="247" font-size="12.5" text-anchor="middle" fill="#62615c">agentry.db, append-only</text><text x="980" y="268" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#2f8f8f">the source of truth</text><path d="M520,186 V164 H980 V166" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="730.99" y="153" width="58.019999999999996" height="22" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.5"/><text x="760" y="168" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2f8f8f">commit</text><rect x="860" y="318" width="240" height="76" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="878" y="343.0" font-size="15.5" font-weight="650" fill="#1c1c1b">At startup</text><text x="878" y="363.0" font-size="12.5" fill="#62615c">replays the log into current.State:</text><text x="878" y="381.0" font-size="12.5" fill="#62615c">about 0.2 s, about 1.3 MB held</text><path d="M980,290 V314" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M860,356 H812" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><line x1="48" y1="432" x2="1152" y2="432" stroke="#dddcd6"/><text x="48" y="462" font-size="11" font-weight="700" text-anchor="start" fill="#93918a">READERS</text><text x="124.89999999999999" y="462" font-size="12.5" font-weight="400" text-anchor="start" fill="#62615c">take a snapshot under a read lock: a task they hold is never changed again</text><rect x="48" y="484" width="246" height="84" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="66" y="513.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The page&#x27;s API</text><text x="66" y="533.0" font-size="12.5" fill="#62615c">tasks, questions, agents,</text><text x="66" y="551.0" font-size="12.5" fill="#62615c">one task: no SQL, no replay</text><rect x="334" y="484" width="246" height="84" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.55" stroke-width="1.2"/><text x="352" y="513.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Coordinator loop</text><text x="352" y="533.0" font-size="12.5" fill="#62615c">the task it acts on</text><text x="352" y="551.0" font-size="12.5" fill="#62615c">and the roster</text><rect x="620" y="484" width="246" height="84" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.55" stroke-width="1.2"/><text x="638" y="513.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Watchdog and hooks</text><text x="638" y="533.0" font-size="12.5" fill="#62615c">every open turn each second;</text><text x="638" y="551.0" font-size="12.5" fill="#62615c">the task of each tool call</text><rect x="906" y="484" width="246" height="84" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="924" y="513.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The log, when asked</text><text x="924" y="533.0" font-size="12.5" fill="#62615c">from SQLite, never past the</text><text x="924" y="551.0" font-size="12.5" fill="#62615c">applied position (step 5)</text><text x="48" y="604" font-size="12.5" font-weight="400" text-anchor="start" fill="#62615c">Readers never write to the state; only step 4 does, under the store&#x27;s lock.</text></svg>
