<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Shipping through the git host"><title>Shipping through the git host</title><defs><marker id="a-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="700" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="698.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY · T-019</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">Shipping through the git host</text><text x="48" y="114" font-size="15" fill="#62615c">A checked task&#x27;s branch push opens the request; every two minutes the job asks GitLab what happened.</text><rect x="48" y="160" width="258" height="84" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="66" y="189.0" font-size="15.5" font-weight="650" fill="#1c1c1b">1  Checked</text><text x="66" y="209.0" font-size="12.5" fill="#62615c">the checkers approved, or</text><text x="66" y="227.0" font-size="12.5" fill="#62615c">you moved it to Shipping</text><rect x="330" y="160" width="258" height="84" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="348" y="189.0" font-size="15.5" font-weight="650" fill="#1c1c1b">2  Deployer pushes</text><text x="348" y="209.0" font-size="12.5" fill="#62615c">HEAD:agentry/task-N,</text><text x="348" y="227.0" font-size="12.5" fill="#62615c">asked of you first</text><rect x="612" y="160" width="258" height="84" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.55" stroke-width="1.2"/><text x="630" y="189.0" font-size="15.5" font-weight="650" fill="#1c1c1b">3  The job</text><text x="630" y="209.0" font-size="12.5" fill="#62615c">sees the push, asks GitLab</text><text x="630" y="227.0" font-size="12.5" fill="#62615c">first, opens one request</text><rect x="894" y="160" width="258" height="84" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="912" y="189.0" font-size="15.5" font-weight="650" fill="#1c1c1b">4  GitLab</text><text x="912" y="209.0" font-size="12.5" fill="#62615c">the merge request, which</text><text x="912" y="227.0" font-size="12.5" fill="#62615c">you merge, and its pipelines</text><path d="M310,202 H326" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M592,202 H608" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M874,202 H890" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="894" y="320" width="258" height="84" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="912" y="349.0" font-size="15.5" font-weight="650" fill="#1c1c1b">5  Polling, every 2 min</text><text x="912" y="369.0" font-size="12.5" fill="#62615c">the job asks for each open</text><text x="912" y="387.0" font-size="12.5" fill="#62615c">request, its pipelines and jobs</text><path d="M1023,248 V316" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="960.64" y="271" width="124.72" height="22" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.5"/><text x="1023" y="286" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3f7cc0">state, pipelines</text><path d="M524.0,314 V418 A116.0,14 0 0 0 756.0,418 V314" fill="#ffffff" stroke="#2f8f8f" stroke-width="1.4"/><ellipse cx="640" cy="314" rx="116.0" ry="14" fill="#e4f1f1" stroke="#2f8f8f" stroke-width="1.4"/><text x="640" y="358" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1c1b">The log</text><text x="640" y="377" font-size="12.5" text-anchor="middle" fill="#62615c">git.* in task-N, only what changed</text><path d="M890,362 H760" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M741,248 V272 H660 V296" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-clay)"/><rect x="688.645" y="261" width="104.71" height="22" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.5"/><text x="741" y="276" font-size="11.5" font-weight="600" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#d4673f">git.pr_opened</text><rect x="48" y="320" width="258" height="84" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="66" y="349.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Task slice</text><text x="66" y="369.0" font-size="12.5" fill="#62615c">current.State keeps the git</text><text x="66" y="387.0" font-size="12.5" fill="#62615c">state of each task</text><path d="M520,362 H310" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="48" y="500" width="258" height="84" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="66" y="538.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Merge request tab</text><text x="66" y="558.0" font-size="12.5" fill="#62615c">request, state, pipeline jobs</text><rect x="330" y="500" width="258" height="84" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="348" y="538.0" font-size="15.5" font-weight="650" fill="#1c1c1b">show_pipeline</text><text x="348" y="558.0" font-size="12.5" fill="#62615c">the MCP tool, from the slice</text><rect x="612" y="500" width="258" height="84" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="630" y="538.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Waits for you</text><text x="630" y="558.0" font-size="12.5" fill="#62615c">when the pipeline failed</text><path d="M177,408 V496" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M177,452 H459 V496" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M459,452 H741 V496" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="894" y="500" width="258" height="84" fill="#ffffff" stroke="#93918a" stroke-opacity="0.8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="912" y="529.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Webhook, later</text><text x="912" y="549.0" font-size="12.5" fill="#62615c">optional, once Agentry has a</text><text x="912" y="567.0" font-size="12.5" fill="#62615c">public https address</text><path d="M1023,496 V408" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#a-muted)"/><rect x="1031" y="441" width="110" height="22" fill="#fafaf8"/><text x="1037" y="456" font-size="11.5" font-weight="600" fill="#93918a">same events</text><text x="48" y="640" font-size="12.5" font-weight="400" text-anchor="start" fill="#62615c">No review.approved event: the push only happens once the work is checked. Old pushes to dev never open a request.</text><text x="48" y="662" font-size="12.5" font-weight="400" text-anchor="start" fill="#62615c">Without the feature&#x27;s code, git.* events are skipped and counted; the token stays in features.toml. GitHub comes later.</text></svg>
