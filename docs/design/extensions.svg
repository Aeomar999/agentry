<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How a feature plugs in"><title>How a feature plugs in</title><defs><marker id="a-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="800" rx="8" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="798.5" rx="7.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">How a feature plugs in</text><text x="48" y="114" font-size="15" fill="#62615c">A feature registers once, in serve.go. Each part lands in one core slot, and the core never names it.</text><rect x="250" y="140" width="440" height="620" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="270" y="168" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">CORE: NAMES NO FEATURE</text><rect x="790" y="140" width="362" height="620" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="810" y="168" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">THE IDEAS FEATURE, INTERNAL/IDEAS</text><rect x="270" y="184" width="400" height="56" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="208.0" font-size="15.5" font-weight="650" fill="#1c1c1b">events catalogue</text><text x="288" y="228.0" font-size="12.5" fill="#62615c">types, writers, a stream prefix</text><rect x="808" y="184" width="326" height="56" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="208.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Types in idea-N streams</text><text x="826" y="228.0" font-size="12.5" fill="#62615c">idea.suggested, accepted, dismissed</text><path d="M802,212 H676" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="270" y="254" width="400" height="56" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="278.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Store.Propose, rules.Check</text><text x="288" y="298.0" font-size="12.5" fill="#62615c">check 3 under the one write lock</text><rect x="808" y="254" width="326" height="56" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="278.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Streams.Check</text><text x="826" y="298.0" font-size="12.5" fill="#62615c">suggested once, decided once while open</text><path d="M802,282 H676" fill="none" stroke="#b7840d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><rect x="270" y="324" width="400" height="56" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="348.0" font-size="15.5" font-weight="650" fill="#1c1c1b">current.State</text><text x="288" y="368.0" font-size="12.5" fill="#62615c">one applier, rebuilt from the log</text><rect x="808" y="324" width="326" height="56" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="348.0" font-size="15.5" font-weight="650" fill="#1c1c1b">FromEvents, Next</text><text x="826" y="368.0" font-size="12.5" fill="#62615c">the ideas slice, built and applied</text><path d="M802,352 H676" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><rect x="270" y="394" width="400" height="56" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="418.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Coordinator loop</text><text x="288" y="438.0" font-size="12.5" fill="#62615c">briefs and done decisions</text><rect x="808" y="394" width="326" height="56" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="418.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Coordinator hook</text><text x="826" y="438.0" font-size="12.5" fill="#62615c">on done, a Visionaries lead&#x27;s ideas</text><path d="M802,422 H676" fill="none" stroke="#d4673f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-clay)"/><rect x="270" y="464" width="400" height="56" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="488.0" font-size="15.5" font-weight="650" fill="#1c1c1b">web: routes mounted by Route.Auth</text><text x="288" y="508.0" font-size="12.5" fill="#62615c">UI, desk or signed, never unwrapped</text><rect x="808" y="464" width="326" height="56" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="488.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Routes</text><text x="826" y="508.0" font-size="12.5" fill="#62615c">/api/ideas, accept, dismiss</text><path d="M802,492 H676" fill="none" stroke="#3f7cc0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="270" y="534" width="400" height="56" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="558.0" font-size="15.5" font-weight="650" fill="#1c1c1b">GET /api/features, /api/waiting</text><text x="288" y="578.0" font-size="12.5" fill="#62615c">what shows, and what waits for you</text><rect x="808" y="534" width="326" height="56" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="558.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Manifest, Waiting</text><text x="826" y="578.0" font-size="12.5" fill="#62615c">on while the team or any idea exists</text><path d="M802,562 H676" fill="none" stroke="#3f7cc0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="270" y="604" width="400" height="56" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="628.0" font-size="15.5" font-weight="650" fill="#1c1c1b">mcp: tools</text><text x="288" y="648.0" font-size="12.5" fill="#62615c">for Claude Code sessions</text><rect x="808" y="604" width="326" height="56" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="628.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Tools</text><text x="826" y="648.0" font-size="12.5" fill="#62615c">list_ideas, accept_idea, dismiss_idea</text><path d="M802,632 H676" fill="none" stroke="#3f7cc0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="270" y="674" width="400" height="56" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="288" y="698.0" font-size="15.5" font-weight="650" fill="#1c1c1b">UI shell: router, sidebar, Ctrl K</text><text x="288" y="718.0" font-size="12.5" fill="#62615c">shows what the manifest says</text><rect x="808" y="674" width="326" height="56" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="826" y="698.0" font-size="15.5" font-weight="650" fill="#1c1c1b">FeatureUI, ui/src/features/ideas</text><text x="826" y="718.0" font-size="12.5" fill="#62615c">the /ideas page, nav item, command</text><path d="M802,702 H676" fill="none" stroke="#4f8a3c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M50.0,264 V356 A80.0,14 0 0 0 210.0,356 V264" fill="#ffffff" stroke="#2f8f8f" stroke-width="1.4"/><ellipse cx="130" cy="264" rx="80.0" ry="14" fill="#e4f1f1" stroke="#2f8f8f" stroke-width="1.4"/><text x="130" y="308" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1c1b">The log</text><text x="130" y="327" font-size="12.5" text-anchor="middle" fill="#62615c">agentry.db</text><text x="130" y="400" font-size="12.5" font-weight="400" text-anchor="middle" fill="#62615c">Propose commits;</text><text x="130" y="418" font-size="12.5" font-weight="400" text-anchor="middle" fill="#62615c">State replays it</text><path d="M266,282 H214" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><path d="M214,352 H266" fill="none" stroke="#2f8f8f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-teal)"/><text x="48" y="784" font-size="12.5" font-weight="400" text-anchor="start" fill="#62615c">It writes only through Core.Log, which checks its types. Without its code, its events stay, are skipped and counted, and new ones are refused.</text></svg>
