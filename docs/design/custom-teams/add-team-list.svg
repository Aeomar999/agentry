  .mark { fill: #424854; }
</style>
<rect width="1600" height="1180" fill="#f6f7f9"/>
<text x="40" y="46" class="h1">Add a team · your templates beside the built-in ones</text>
<text x="40" y="72" class="sub">Today's dialog, in three groups. Triage is being deleted. Words from copy.md.</text>

<!-- page behind under a flat scrim -->
<rect x="40" y="100" width="1200" height="1040" fill="#ffffff" stroke="#cdd1d8"/>
<rect x="40" y="100" width="1200" height="1040" fill="#1f2329" fill-opacity="0.32"/>

<!-- dialog -->
<rect x="200" y="124" width="880" height="992" fill="#ffffff" stroke="#cdd1d8"/>
<text x="224" y="162" class="h2">Add a team</text>
<rect x="1036" y="140" width="32" height="32" rx="3" fill="none" stroke="#cdd1d8"/>
<path d="M1046,150 L1058,162 M1058,150 L1046,162" stroke="#424854" stroke-width="1.5"/>
<line x1="200" y1="186" x2="1080" y2="186" stroke="#e3e5ea"/>
<text x="224" y="212" class="hint">Each team comes with a coordinator and its specialists, each with a prompt written for the work. Add one as it</text>
<text x="224" y="228" class="hint">is, change it first, or build your own.</text>

<!-- group 1: build your own -->
<text x="224" y="264" class="grp">Build your own</text>
<rect x="224" y="274" width="832" height="64" rx="4" class="card"/>
<text x="244" y="300" class="name">A team of your own</text>
<text x="244" y="320" class="desc">Start blank or copy a template, then change any agent.</text>
<rect x="924" y="290" width="112" height="32" rx="3" fill="#fc6d26"/>
<text x="980" y="311" class="pri" text-anchor="middle">Build a team</text>

<!-- group 2: your templates -->
<text x="224" y="376" class="grp">Your templates</text>
<!-- Handbook -->
<rect x="224" y="386" width="404" height="196" rx="4" class="card"/>
<text x="244" y="414" class="name">Handbook</text>
<text x="608" y="414" class="quiet" text-anchor="end">Delete template</text>
<text x="244" y="438" class="desc">Takes every piece of writing, sets its brief,</text>
<text x="244" y="454" class="desc">decides who works on it next, and edits it</text>
<rect x="244" y="470" width="50" height="20" rx="2" class="leadb"/><text x="250" y="484" class="lead">editor</text>
<rect x="300" y="470" width="64" height="20" rx="2" class="chipb"/><text x="306" y="484" class="chip">drafter</text>
<rect x="370" y="470" width="98" height="20" rx="2" class="chipb"/><text x="376" y="484" class="chip">fact-checker</text>
<rect x="474" y="470" width="90" height="20" rx="2" class="chipb"/><text x="480" y="484" class="chip">illustrator</text>
<text x="244" y="516" class="hint">Saved 12 Oct from the Handbook team.</text>
<rect x="244" y="534" width="104" height="32" rx="3" fill="#fc6d26"/>
<text x="296" y="555" class="pri" text-anchor="middle">Add this team</text>
<rect x="356" y="534" width="116" height="32" rx="3" class="ghost"/>
<text x="414" y="555" class="btn" text-anchor="middle">Change it first</text>

<!-- Triage, confirming delete -->
<rect x="652" y="386" width="404" height="196" rx="4" class="card"/>
<text x="672" y="414" class="name">Triage</text>
<text x="672" y="438" class="desc">Sorts incoming bug reports, reproduces them</text>
<text x="672" y="454" class="desc">and files a task for each</text>
<rect x="672" y="470" width="78" height="20" rx="2" class="leadb"/><text x="678" y="484" class="lead">triage-lead</text>
<rect x="756" y="470" width="80" height="20" rx="2" class="chipb"/><text x="762" y="484" class="chip">reproducer</text>
<line x1="653" y1="502" x2="1055" y2="502" stroke="#e3e5ea"/>
<text x="672" y="524" class="danger">Delete the Triage template?</text>
<text x="672" y="544" class="hint">Teams you made from it</text>
<text x="672" y="560" class="hint">stay as they are.</text>
<rect x="890" y="534" width="68" height="32" rx="3" fill="#ffffff" stroke="#d05e27" stroke-width="2"/>
<text x="924" y="555" class="btn" text-anchor="middle">Keep</text>
<rect x="966" y="534" width="70" height="32" rx="3" fill="#ffffff" stroke="#9c3739"/>
<text x="1001" y="555" class="danger" text-anchor="middle">Delete</text>

<!-- group 3: built in -->
<text x="224" y="620" class="grp">Built in</text>
<rect x="224" y="630" width="404" height="196" rx="4" class="card"/>
<text x="244" y="658" class="name">Software</text>
<rect x="318" y="644" width="78" height="20" rx="2" fill="#f0f1f4" stroke="#cdd1d8"/>
<text x="357" y="658" class="badge" text-anchor="middle">you have it</text>
<text x="244" y="682" class="desc">Builds and changes software: writes the code</text>
<text x="244" y="698" class="desc">with tests, reviews it, tries it for real and ships it.</text>
<rect x="244" y="714" width="74" height="20" rx="2" class="leadb"/><text x="250" y="728" class="lead">tech-lead</text>
<rect x="324" y="714" width="66" height="20" rx="2" class="chipb"/><text x="330" y="728" class="chip">engineer</text>
<rect x="396" y="714" width="66" height="20" rx="2" class="chipb"/><text x="402" y="728" class="chip">reviewer</text>
<rect x="468" y="714" width="52" height="20" rx="2" class="chipb"/><text x="474" y="728" class="chip">tester</text>
<rect x="526" y="714" width="66" height="20" rx="2" class="chipb"/><text x="532" y="728" class="chip">deployer</text>
<rect x="244" y="778" width="104" height="32" rx="3" class="ghost"/>
<text x="296" y="799" class="btn" text-anchor="middle">Add another</text>
<rect x="356" y="778" width="116" height="32" rx="3" class="ghost"/>
<text x="414" y="799" class="btn" text-anchor="middle">Change it first</text>

<rect x="652" y="630" width="404" height="196" rx="4" class="card"/>
<text x="672" y="658" class="name">Writing</text>
<text x="672" y="682" class="desc">Writes articles, documentation, reports and</text>
<text x="672" y="698" class="desc">proposals: researched, drafted for the reader…</text>
<rect x="672" y="714" width="50" height="20" rx="2" class="leadb"/><text x="678" y="728" class="lead">editor</text>
<rect x="728" y="714" width="82" height="20" rx="2" class="chipb"/><text x="734" y="728" class="chip">researcher</text>
<rect x="816" y="714" width="52" height="20" rx="2" class="chipb"/><text x="822" y="728" class="chip">writer</text>
<rect x="874" y="714" width="98" height="20" rx="2" class="chipb"/><text x="880" y="728" class="chip">fact-checker</text>
<rect x="672" y="778" width="104" height="32" rx="3" fill="#fc6d26"/>
<text x="724" y="799" class="pri" text-anchor="middle">Add this team</text>
<rect x="784" y="778" width="116" height="32" rx="3" class="ghost"/>
<text x="842" y="799" class="btn" text-anchor="middle">Change it first</text>

<rect x="224" y="842" width="404" height="196" rx="4" class="card"/>
<text x="244" y="870" class="name">Research</text>
<text x="244" y="894" class="desc">Answers questions with evidence: frames the</text>
<text x="244" y="910" class="desc">question, gathers sources and data…</text>
<rect x="244" y="926" width="102" height="20" rx="2" class="leadb"/><text x="250" y="940" class="lead">research-lead</text>
<rect x="352" y="926" width="98" height="20" rx="2" class="chipb"/><text x="358" y="940" class="chip">investigator</text>
<rect x="456" y="926" width="60" height="20" rx="2" class="chipb"/><text x="462" y="940" class="chip">analyst</text>
<rect x="522" y="926" width="52" height="20" rx="2" class="chipb"/><text x="528" y="940" class="chip">critic</text>
<rect x="244" y="990" width="104" height="32" rx="3" fill="#fc6d26"/>
<text x="296" y="1011" class="pri" text-anchor="middle">Add this team</text>
<rect x="356" y="990" width="116" height="32" rx="3" class="ghost"/>
<text x="414" y="1011" class="btn" text-anchor="middle">Change it first</text>

<rect x="652" y="842" width="404" height="196" rx="4" class="card"/>
<text x="672" y="870" class="name">Design</text>
<text x="672" y="894" class="desc">Designs products and features: frames the</text>
<text x="672" y="910" class="desc">problem, maps the flows, draws wireframes…</text>
<rect x="672" y="926" width="94" height="20" rx="2" class="leadb"/><text x="678" y="940" class="lead">product-lead</text>
<rect x="772" y="926" width="122" height="20" rx="2" class="chipb"/><text x="778" y="940" class="chip">product-designer</text>
<rect x="900" y="926" width="72" height="20" rx="2" class="chipb"/><text x="906" y="940" class="chip">ux-writer</text>
<rect x="672" y="990" width="104" height="32" rx="3" fill="#fc6d26"/>
<text x="724" y="1011" class="pri" text-anchor="middle">Add this team</text>
<rect x="784" y="990" width="116" height="32" rx="3" class="ghost"/>
<text x="842" y="1011" class="btn" text-anchor="middle">Change it first</text>
<text x="224" y="1072" class="hint">Visionaries and the rest follow; the dialog body scrolls, its title stays.</text>

<!-- markers -->
<circle cx="214" cy="306" r="9" class="mark"/><text x="214" y="310" class="num" text-anchor="middle">1</text>
<circle cx="214" cy="372" r="9" class="mark"/><text x="214" y="376" class="num" text-anchor="middle">2</text>
<circle cx="618" cy="428" r="9" class="mark"/><text x="618" y="432" class="num" text-anchor="middle">3</text>
<circle cx="1066" cy="550" r="9" class="mark"/><text x="1066" y="554" class="num" text-anchor="middle">4</text>
<circle cx="484" cy="550" r="9" class="mark"/><text x="484" y="554" class="num" text-anchor="middle">5</text>
<circle cx="214" cy="616" r="9" class="mark"/><text x="214" y="620" class="num" text-anchor="middle">6</text>

<!-- notes -->
<text x="1276" y="140" class="noteh">The way in stays the same</text>
<text x="1276" y="158" class="note">"Add a team" on the Agents page opens today's</text>
<text x="1276" y="174" class="note">wide Dialog. Every action that leads to the team</text>
<text x="1276" y="190" class="note">panel closes the dialog first: one surface open.</text>
<text x="1276" y="220" class="noteh">1 · Build your own</text>
<text x="1276" y="238" class="note">Always first. "Build a team" opens the panel at</text>
<text x="1276" y="254" class="note">?team=new with Blank chosen.</text>
<text x="1276" y="284" class="noteh">2 · Your templates</text>
<text x="1276" y="300" class="note">Only when you have one; newest first. Same card</text>
<text x="1276" y="316" class="note">as a built-in, plus where it came from. Groups are</text>
<text x="1276" y="332" class="note">h3 headings over a list, cards are list items.</text>
<text x="1276" y="362" class="noteh">3 · Delete template (quiet text button)</text>
<text x="1276" y="380" class="note">Only on your templates. Its label names it:</text>
<text x="1276" y="396" class="note">"Delete template, Handbook". Hit area 28px.</text>
<text x="1276" y="426" class="noteh">4 · Confirm in place</text>
<text x="1276" y="444" class="note">The card's actions become the question; focus on</text>
<text x="1276" y="460" class="note">Keep; Esc is Keep. Delete removes the card, then</text>
<text x="1276" y="476" class="note">focus goes to the next card's first button, or</text>
<text x="1276" y="492" class="note">"Build a team" if none is left. Toast "Deleted the</text>
<text x="1276" y="508" class="note">Triage template". A failure shows its reason in</text>
<text x="1276" y="524" class="note">the card, and the card stays.</text>
<text x="1276" y="554" class="noteh">5 · Two actions on every template</text>
<text x="1276" y="572" class="note">"Add this team" ("Add another" when you have it)</text>
<text x="1276" y="588" class="note">adds it in one action; "Change it first" opens the</text>
<text x="1276" y="604" class="note">panel copying it. Names add the card: "Add this</text>
<text x="1276" y="620" class="note">team, Handbook". The refused card keeps the offer.</text>
<text x="1276" y="650" class="noteh">6 · Built in</text>
<text x="1276" y="668" class="note">Today's cards, no delete.</text>
<text x="1276" y="684" class="note">The coordinator chip on every card changes from</text>
<text x="1276" y="700" class="note">text-brand to text-brand-ink (Badge brand's ink).</text>
<text x="1276" y="730" class="noteh">Phone</text>
<text x="1276" y="748" class="note">The grid is one column below sm (640px), as</text>
<text x="1276" y="764" class="note">today; the two buttons wrap under each other</text>
<text x="1276" y="780" class="note">when the card is narrower than 300px.</text>
<!-- the chip fix, both themes, measured -->
<text x="1276" y="820" class="noteh">Coordinator chip contrast (text, 11px mono)</text>
<rect x="1276" y="832" width="284" height="96" fill="#ffffff" stroke="#e3e5ea"/>
<rect x="1288" y="844" width="74" height="20" rx="2" fill="#fff4ee"/><text x="1294" y="858" class="chip" style="fill:#fc6d26">tech-lead</text>
<text x="1372" y="858" class="note">today: brand  2.6:1  fails</text>
<rect x="1288" y="876" width="74" height="20" rx="2" fill="#fff4ee"/><text x="1294" y="890" class="lead">tech-lead</text>
<text x="1372" y="890" class="note">brand-ink #994c27  5.7:1</text>
<text x="1288" y="918" class="hint">Light, on brand-soft over surface-0.</text>
<rect x="1276" y="936" width="284" height="96" fill="#1a1d23" stroke="#2b2f38"/>
<rect x="1288" y="948" width="74" height="20" rx="2" fill="#2c2323"/><text x="1294" y="962" class="chip" style="fill:#fc6d26">tech-lead</text>
<text x="1372" y="962" class="note" style="fill:#b3b7c0">today: brand  5.4:1</text>
<rect x="1288" y="980" width="74" height="20" rx="2" fill="#2c2323"/><text x="1294" y="994" class="chip" style="fill:#f87f44">tech-lead</text>
<text x="1372" y="994" class="note" style="fill:#b3b7c0">brand-ink #f87f44  5.9:1</text>
<text x="1288" y="1022" class="hint" style="fill:#8b919e">Dark, on brand-soft over surface-0.</text>
<text x="1276" y="1052" class="note">Lowest case, light on surface-2: 5.1:1. One</text>
<text x="1276" y="1068" class="note">class change; no new token.</text>
</svg>
