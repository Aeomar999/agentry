<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="t d">
<title id="t">Add a team dialog: build your own, your templates, built in, deleting a template</title>
<desc id="d">The existing Add a team dialog in three groups: a Build your own card, Your templates (Handbook, and Triage asking to confirm its delete), and the Built in templates. Every template card has Add this team and Change it first. Light theme, existing tokens.</desc>
<style>
  text { font-family: "IBM Plex Sans", "Noto Sans", sans-serif; font-size: 13px; fill: #1f2329; }
  .h1 { font-size: 22px; font-weight: 700; }
  .h2 { font-size: 17px; font-weight: 700; }
  .sub { fill: #6b7280; }
  .grp { font-size: 12px; font-weight: 700; fill: #424854; }
  .name { font-size: 14px; font-weight: 600; }
  .desc { font-size: 12px; fill: #424854; }
  .hint { font-size: 12px; fill: #6b7280; }
  .chip { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #424854; }
  .lead { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 11px; fill: #994c27; }
  .btn { font-size: 12.5px; font-weight: 600; }
  .pri { fill: #ffffff; font-size: 12.5px; font-weight: 600; }
  .danger { fill: #9c3739; font-size: 12.5px; font-weight: 600; }
