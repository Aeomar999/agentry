<text x="384" y="562" class="hint">One line. The coordinator reads it to</text>
<text x="384" y="578" class="hint">choose who works next.</text>
<text x="84" y="610" class="lbl">Prompt</text>
<rect x="84" y="618" width="592" height="120" rx="3" fill="#fafafa" stroke="#cdd1d8"/>
<text x="96" y="642" class="ph">Empty: it uses Agentry's coordinator prompt for a team of these agents.</text>
<text x="84" y="756" class="hint">Empty: it uses Agentry's coordinator prompt for a team of these agents.</text>
<text x="84" y="780" class="link">See the default</text>
<text x="84" y="814" class="lbl">Colour</text>
<rect x="84" y="822" width="24" height="24" rx="2" fill="#2563eb"/>
<rect x="114" y="822" width="24" height="24" rx="2" fill="#7c3aed"/>
