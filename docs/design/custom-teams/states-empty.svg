<text x="824" y="1636" class="noteh">8 · No "Your templates" group at all</text>
<text x="824" y="1654" class="note">Not an empty group with a "nothing here" line: the group appears with your first template.</text>
<text x="824" y="1670" class="note">Where templates come from is said once, in the Edit team panel's "Save as a template".</text>
<text x="824" y="1700" class="noteh">Built in stays last and unchanged</text>
<text x="824" y="1718" class="note">Same cards as today plus "Change it first"; coordinator chips in brand-ink (add-team-list.svg).</text>
