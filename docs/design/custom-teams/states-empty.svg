<text x="124" y="1011" class="btn" text-anchor="middle">+ Add agent</text>
<text x="196" y="1011" class="hint">Add the agents it hands work to.</text>

<line x1="40" y1="1060" x2="720" y2="1060" class="rule"/>
<text x="64" y="1099" class="hint">Creates the team and its coordinator.</text>
<rect x="480" y="1076" width="84" height="36" rx="3" fill="#ffffff" stroke="#cdd1d8"/>
<text x="522" y="1099" class="btn" text-anchor="middle">Cancel</text>
