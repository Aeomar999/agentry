<text x="244" y="345" class="sub btn" text-anchor="middle">Copy a template</text>
<text x="64" y="376" class="hint">A coordinator to start; add the agents it hands work to.</text>

<text x="64" y="412" class="lbl">Agents · one coordinates</text>
<text x="696" y="412" class="hint" text-anchor="end">1 agent</text>

