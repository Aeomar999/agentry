<text x="566" y="1512" class="quiet">+ Add agent</text>
<text x="646" y="1512" class="quiet">Remove team</text>
<rect x="64" y="1528" width="216" height="96" rx="4" fill="#ffffff" stroke="#cdd1d8"/>
<circle cx="82" cy="1550" r="5" fill="#db2777"/><text x="94" y="1554" class="mono" font-weight="600">visionary</text>
<rect x="292" y="1528" width="216" height="96" rx="4" class="card"/>
<rect x="520" y="1528" width="216" height="96" rx="4" class="card"/>

<circle cx="484" cy="1352" r="9" class="mark"/><text x="484" y="1356" class="num" text-anchor="middle">6</text>
<circle cx="516" cy="1220" r="9" class="mark"/><text x="516" y="1224" class="num" text-anchor="middle">7</text>

<text x="64" y="1666" class="noteh">6 · Edit team on every heading, from day one</text>
<text x="64" y="1684" class="note">A team added from a template is edited like any other, so there is no empty "your teams" place to</text>
<text x="64" y="1700" class="note">fill. The three heading actions are text buttons in ink-muted, 12px, each with a 28px hit area.</text>
<text x="64" y="1730" class="noteh">7 · Add a team is the way to build one</text>
<text x="64" y="1748" class="note">"New agent" stays for a single agent; the heading's "+ Add agent" now opens the panel instead.</text>

<!-- ============ C: Add a team, no templates of yours ============ -->
