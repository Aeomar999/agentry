<circle cx="396" cy="244" r="9" class="mark"/><text x="396" y="248" class="num" text-anchor="middle">1</text>
<circle cx="336" cy="340" r="9" class="mark"/><text x="336" y="344" class="num" text-anchor="middle">2</text>
<circle cx="54" cy="448" r="9" class="mark"/><text x="54" y="452" class="num" text-anchor="middle">3</text>
<circle cx="54" cy="660" r="9" class="mark"/><text x="54" y="664" class="num" text-anchor="middle">4</text>
<circle cx="708" cy="1094" r="9" class="mark"/><text x="708" y="1098" class="num" text-anchor="middle">5</text>

<text x="760" y="140" class="noteh">1 · Team name, empty and focused</text>
<text x="760" y="158" class="note">No suggestion on Blank: nothing to name it after. No placeholder text;</text>
<text x="760" y="174" class="note">the label and hint say what it is. Empty is an error only on leaving it</text>
<text x="760" y="190" class="note">after typing, or on Create team; never while the panel first opens.</text>
<text x="760" y="220" class="noteh">2 · Blank chosen</text>
<text x="760" y="238" class="note">The template select is not shown, so nothing on screen asks for a</text>
<text x="760" y="254" class="note">choice you didn't make. Choosing Copy a template shows it; with rows</text>
<text x="760" y="270" class="note">changed it asks first (states-unsaved-and-replace.svg).</text>
<text x="760" y="300" class="noteh">3 · One row, open, already the coordinator</text>
<text x="760" y="318" class="note">Named "coordinator", or "coordinator-2", "-3" if taken (numbered as copies</text>
<text x="760" y="334" class="note">are), orange, its radio checked: valid from the start. Open, the only row;</text>
<text x="760" y="350" class="note">its Name is not focused (Team name is). Remove works as on any row:</text>
<text x="760" y="366" class="note">it leaves no coordinator and an empty list (see the empty list below).</text>
<text x="760" y="396" class="noteh">4 · The default coordinator prompt</text>
<text x="760" y="412" class="note">The empty box's placeholder, in ink-muted (4.8:1 on surface-1), and the</text>
<text x="760" y="428" class="note">hint under it both say the default applies; the placeholder alone</text>
<text x="760" y="444" class="note">would vanish on typing and isn't read by every screen reader.</text>
<text x="760" y="474" class="noteh">5 · Create team is on, not disabled</text>
<text x="760" y="492" class="note">A disabled button can't say why. Pressing it with an empty name shows</text>
<text x="760" y="508" class="note">the error summary (states-validation.svg).</text>

<text x="760" y="548" class="noteh">The list with no agents (after removing the only row)</text>
<rect x="760" y="560" width="632" height="76" fill="#ffffff" stroke="#cdd1d8" stroke-dasharray="4 3"/>
<text x="780" y="590" class="sub"><tspan class="mono" style="fill:#6b7280">coordinator</tspan> removed</text>
<rect x="1306" y="572" width="70" height="26" rx="3" fill="#ffffff" stroke="#cdd1d8"/>
<text x="1341" y="590" class="btn" text-anchor="middle">Undo</text>
<text x="780" y="618" class="hint">No agents yet. Add one: it coordinates the team.</text>
<text x="760" y="660" class="note">The stub keeps Undo; the line under it replaces the list. "+ Add agent"</text>
<text x="760" y="676" class="note">stays below. The first agent added after this is checked as the</text>
<text x="760" y="692" class="note">coordinator, since a team of one has nobody else to pick.</text>

