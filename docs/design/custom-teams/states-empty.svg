<text x="84" y="500" class="lbl">Name</text>
<rect x="84" y="508" width="280" height="36" rx="3" class="box"/>
<text x="96" y="531" class="mono">coordinator</text>
<text x="84" y="562" class="hint">Lowercase letters, digits and dashes.</text>
<text x="384" y="500" class="lbl">Description</text>
