<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="t d">
<title id="t">Empty states: a blank New team, the Agents page before any team of your own, Add a team without your templates</title>
<desc id="d">A: the New team panel with Blank chosen: the team name empty and focused, one agent row called coordinator, open, its prompt empty and using the default coordinator prompt. B: the Agents page with only teams added from built-in templates; every team heading has Edit team. C: the Add a team dialog when you have no templates of your own: Build your own, then Built in, no Your templates group. Light theme, existing tokens.</desc>
<style>
