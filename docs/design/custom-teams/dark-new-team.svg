<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" role="img" aria-labelledby="t d">
<title id="t">Dark theme: the New team panel</title>
<desc id="d">The New team panel in the dark tokens, copying Writing: the team name taken, with its error in danger-ink; four agent rows, writer open with every field; the coordinator badge in brand-ink on brand-soft; the footer with Cancel and Create team. Notes list each text colour and its contrast on its surface.</desc>
<style>
  text { font-family: "IBM Plex Sans", "Noto Sans", sans-serif; font-size: 13px; fill: #e4e6eb; }
  .h1 { font-size: 22px; font-weight: 700; fill: #1f2329; }
  .subl { fill: #6b7280; }
  .h2 { font-size: 17px; font-weight: 700; }
  .lbl { font-size: 12px; font-weight: 500; fill: #b3b7c0; }
  .hint { font-size: 12px; fill: #8b919e; }
  .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12.5px; }
  .gut { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12px; fill: #8b919e; }
  .ph { fill: #8b919e; font-style: italic; }
  .err { font-size: 12px; fill: #eb8587; }
  .btn { font-size: 13px; font-weight: 600; }
  .pri { fill: #ffffff; font-size: 13px; font-weight: 600; }
  .badge { font-size: 11.5px; font-weight: 600; fill: #b3b7c0; }
  .lead { font-size: 11.5px; font-weight: 600; fill: #f87f44; }
  .note { font-size: 12px; fill: #424854; }
  .noteh { font-size: 12px; font-weight: 700; fill: #1f2329; }
  .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
  .field { fill: #16181d; stroke: #2b2f38; stroke-width: 1; }
  .row { fill: #1a1d23; stroke: #353a44; stroke-width: 1; }
  .rule { stroke: #2b2f38; stroke-width: 1; }
  .caret { fill: none; stroke: #b3b7c0; stroke-width: 1.5; }
  .trash { fill: none; stroke: #b3b7c0; stroke-width: 1.3; }
  .ico { fill: none; stroke: #eb8587; stroke-width: 1.4; }
  .mark { fill: #424854; }
</style>
<defs>
  <g id="alert"><circle cx="6" cy="6" r="5.5" class="ico"/><path d="M6,3.2 v3.4 M6,8.4 v0.6" class="ico"/></g>
  <g id="bin"><rect width="28" height="28" rx="3" fill="none" stroke="#2b2f38"/><path d="M8,8 h12 M10,8 v12 h8 v-12 M12,5 h4" class="trash"/></g>
</defs>
<rect width="1600" height="1220" fill="#f6f7f9"/>
<text x="40" y="46" class="h1">Dark theme · New team</text>
<text x="40" y="72" class="subl">The same panel in the dark tokens (the app's default theme). Only token values change; no layout differs. Words from copy.md.</text>

<!-- page behind under the Dialog scrim (black/50) -->
<rect x="40" y="100" width="1200" height="1080" fill="#16181d"/>
<text x="64" y="140" class="h2">Agents</text>
<text x="64" y="186" class="h2">Software</text>
<rect x="64" y="202" width="460" height="150" fill="#1a1d23" stroke="#2b2f38"/>
<rect x="40" y="100" width="520" height="1080" fill="#000000" fill-opacity="0.5"/>

<!-- panel -->
<rect x="560" y="100" width="680" height="1080" fill="#1a1d23" stroke="#353a44"/>
<text x="584" y="140" class="h2">New team</text>
<rect x="1196" y="116" width="32" height="32" rx="3" fill="none" stroke="#353a44"/>
<path d="M1206,126 L1218,138 M1218,126 L1206,138" stroke="#b3b7c0" stroke-width="1.5"/>
<line x1="560" y1="164" x2="1240" y2="164" class="rule"/>

<text x="584" y="194" class="lbl">Team name</text>
<rect x="584" y="202" width="320" height="36" rx="3" fill="#16181d" stroke="#ef4444"/>
<text x="596" y="225">Writing</text>
<use href="#alert" x="584" y="246"/>
<text x="602" y="256" class="err">You have a team called Writing already. Pick another name.</text>
<text x="584" y="276" class="hint">Shown on the Agents page and on New task.</text>

<text x="584" y="310" class="lbl">Start from</text>
<rect x="584" y="318" width="260" height="36" rx="3" fill="none" stroke="#2b2f38"/>
<text x="628" y="341" class="btn" style="fill:#8b919e">Blank</text>
<rect x="688" y="321" width="153" height="30" rx="2" fill="#2b2f38"/>
<text x="712" y="341" class="btn">Copy a template</text>
<rect x="860" y="318" width="356" height="36" rx="3" class="field"/>
<text x="872" y="341">Writing</text>
<path d="M1196,332 l5,5 l5,-5" class="caret"/>

<text x="584" y="390" class="lbl">Agents · one coordinates</text>
<text x="1216" y="390" class="hint" text-anchor="end">4 agents</text>

<rect x="584" y="400" width="632" height="52" class="row"/>
<path d="M600,420 l5,5 l-5,5" class="caret"/>
<circle cx="626" cy="426" r="5" fill="#fb923c"/>
<text x="640" y="430" class="mono">editor</text>
<rect x="694" y="416" width="80" height="20" rx="2" fill="#2c2323"/>
<text x="734" y="430" class="lead" text-anchor="middle">coordinator</text>
<text x="786" y="430" class="hint">Takes every piece of writing…</text>
<circle cx="1076" cy="426" r="8" fill="#16181d" stroke="#b3b7c0" stroke-width="1.5"/>
<circle cx="1076" cy="426" r="4" fill="#e4e6eb"/>
<text x="1090" y="430" class="lbl">Coordinator</text>
<use href="#bin" x="1182" y="412"/>

<rect x="584" y="452" width="632" height="600" class="row"/>
<path d="M598,474 l5,5 l5,-5" class="caret"/>
<circle cx="626" cy="478" r="5" fill="#60a5fa"/>
<text x="640" y="482" class="mono" font-weight="600">writer</text>
<text x="698" y="482" class="hint">Outlines and drafts the piece for its reader…</text>
<circle cx="1076" cy="478" r="8" fill="#16181d" stroke="#b3b7c0" stroke-width="1.5"/>
<text x="1090" y="482" class="lbl">Coordinator</text>
<use href="#bin" x="1182" y="464"/>
<line x1="585" y1="504" x2="1215" y2="504" class="rule"/>
<text x="604" y="530" class="lbl">Name</text>
<rect x="604" y="538" width="280" height="36" rx="3" class="field"/>
<text x="616" y="561" class="mono">writer</text>
<text x="604" y="592" class="hint">Lowercase letters, digits and dashes.</text>
<text x="904" y="530" class="lbl">Description</text>
<rect x="904" y="538" width="292" height="36" rx="3" class="field"/>
<text x="916" y="561">Outlines and drafts the piece for its…</text>
<text x="904" y="592" class="hint">One line. The coordinator reads it to</text>
<text x="904" y="608" class="hint">choose who works next.</text>
<text x="604" y="626" class="lbl">Prompt</text>
<rect x="604" y="634" width="592" height="160" rx="3" fill="#1a1d23" stroke="#2b2f38"/>
<rect x="605" y="645" width="590" height="20" fill="#16181d"/>
<text x="638" y="660" class="gut" text-anchor="end">1</text><text x="656" y="660" class="mono">You are the writer of the Docs team. You outline and draft each</text>
<text x="656" y="680" class="mono">piece for its reader, in plain language.</text>
<text x="638" y="720" class="gut" text-anchor="end">3</text><text x="656" y="720" class="mono" style="fill:#60a5fa">## How to write</text>
<text x="638" y="760" class="gut" text-anchor="end">5</text><text x="656" y="760" class="mono">- Start from the brief the editor set.</text>
<text x="604" y="812" class="hint">Its standing instructions, at the start of every turn. Tab moves to the next field.</text>
<text x="604" y="848" class="lbl">Colour</text>
<rect x="604" y="856" width="24" height="24" rx="2" fill="#60a5fa"/>
<rect x="601" y="853" width="30" height="30" rx="3" fill="none" stroke="#e4e6eb" stroke-width="2"/>
<rect x="636" y="856" width="24" height="24" rx="2" fill="#a78bfa"/>
<rect x="666" y="856" width="24" height="24" rx="2" fill="#2dd4bf"/>
<rect x="696" y="856" width="24" height="24" rx="2" fill="#4ade80"/>
<rect x="726" y="856" width="24" height="24" rx="2" fill="#fbbf24"/>
<rect x="756" y="856" width="24" height="24" rx="2" fill="#fb923c"/>
<rect x="786" y="856" width="24" height="24" rx="2" fill="#f87171"/>
<rect x="816" y="856" width="24" height="24" rx="2" fill="#f472b6"/>
<rect x="846" y="856" width="24" height="24" rx="2" fill="#94a3b8"/>
<text x="604" y="904" class="hint">Blue. Agents can share a colour.</text>
<text x="904" y="848" class="lbl">Its work counts as</text>
<rect x="904" y="856" width="292" height="36" rx="3" class="field"/>
<text x="916" y="879">Building</text>
<path d="M1176,870 l5,5 l5,-5" class="caret"/>
<text x="904" y="908" class="hint">Checked by the team's reviewers. Its tasks</text>
<text x="904" y="924" class="hint">show in In progress.</text>
<text x="604" y="956" class="lbl">Engine</text>
<rect x="604" y="964" width="132" height="36" rx="3" class="field"/>
<text x="616" y="987">claude</text>
<path d="M716,978 l5,5 l5,-5" class="caret"/>
<text x="752" y="956" class="lbl">Model</text>
<rect x="752" y="964" width="132" height="36" rx="3" class="field"/>
<text x="764" y="987" class="ph">default</text>
<text x="904" y="956" class="lbl">Policy profile</text>
<rect x="904" y="964" width="292" height="36" rx="3" fill="#16181d" stroke="#fc6d26" stroke-width="2"/>
<text x="916" y="987">developer</text>
<path d="M1176,978 l5,5 l5,-5" class="caret"/>
<text x="604" y="1018" class="hint">Model: empty for the engine's default.</text>
<text x="904" y="1018" class="hint">What it may do without asking you.</text>
<text x="604" y="1042" class="hint">Knowledge and where it runs: on its own page, once the team is created.</text>

<rect x="584" y="1052" width="632" height="52" class="row"/>
<path d="M600,1072 l5,5 l-5,5" class="caret"/>
<circle cx="626" cy="1078" r="5" fill="#2dd4bf"/>
<text x="640" y="1082" class="mono">researcher</text>
<text x="728" y="1082" class="hint">Finds and records the facts, figures…</text>
<circle cx="1076" cy="1078" r="8" fill="#16181d" stroke="#b3b7c0" stroke-width="1.5"/>
<text x="1090" y="1082" class="lbl">Coordinator</text>
<use href="#bin" x="1182" y="1064"/>

<line x1="560" y1="1116" x2="1240" y2="1116" class="rule"/>
<text x="584" y="1153" class="hint">Creates the team and its 4 agents.</text>
<rect x="1000" y="1130" width="84" height="36" rx="3" fill="#21252d" stroke="#2b2f38"/>
<text x="1042" y="1153" class="btn" text-anchor="middle">Cancel</text>
<rect x="1096" y="1130" width="120" height="36" rx="3" fill="#fc6d26"/>
<text x="1156" y="1153" class="pri" text-anchor="middle">Create team</text>

<circle cx="914" cy="220" r="9" class="mark"/><text x="914" y="224" class="num" text-anchor="middle">1</text>
<circle cx="574" cy="426" r="9" class="mark"/><text x="574" y="430" class="num" text-anchor="middle">2</text>
<circle cx="1206" cy="982" r="9" class="mark"/><text x="1206" y="986" class="num" text-anchor="middle">3</text>
<circle cx="1228" cy="1148" r="9" class="mark"/><text x="1228" y="1152" class="num" text-anchor="middle">4</text>

<text x="1276" y="120" class="noteh">Text on surface-0 (#1a1d23)</text>
<text x="1276" y="138" class="note">ink-primary #e4e6eb  13.5:1</text>
<text x="1276" y="154" class="note">ink-secondary #b3b7c0 (labels)  8.4:1</text>
<text x="1276" y="170" class="note">ink-muted #8b919e (hints)  5.3:1;</text>
<text x="1276" y="186" class="note">on surface-2 4.9:1</text>
<text x="1276" y="202" class="note">ink-faint #5e6471  2.8:1: not used for text</text>
<text x="1276" y="232" class="noteh">1 · Errors</text>
<text x="1276" y="250" class="note">danger-ink #eb8587  6.6:1 (danger #ef4444</text>
<text x="1276" y="266" class="note">is 4.5:1, too close to use for 12px text).</text>
<text x="1276" y="282" class="note">The field border is danger, 4.5:1. Summary:</text>
<text x="1276" y="298" class="note">danger-ink on danger-soft (#342227) 5.9:1.</text>
<text x="1276" y="328" class="noteh">2 · Coordinator badge</text>
<text x="1276" y="346" class="note">brand-ink #f87f44 on brand-soft (#2c2323)</text>
<text x="1276" y="362" class="note">5.9:1, the Badge brand variant as today.</text>
<text x="1276" y="378" class="note">Agent dots use the dark agent colours (blue</text>
<text x="1276" y="394" class="note">#60a5fa 6.6:1); the name is always text.</text>
<text x="1276" y="424" class="noteh">3 · Focus</text>
<text x="1276" y="442" class="note">The focus line is brand #fc6d26, 5.9:1 on</text>
<text x="1276" y="458" class="note">surface-0 (light uses a darker mix, 3:1+).</text>
<text x="1276" y="474" class="note">The prompt editor is on surface-0 with the</text>
<text x="1276" y="490" class="note">current line in surface-1, as lib/monaco does.</text>
<text x="1276" y="520" class="noteh">4 · Primary button</text>
<text x="1276" y="538" class="note">White on brand is 2.9:1 in both themes:</text>
<text x="1276" y="554" class="note">app-wide, drawn as it is, an open question</text>
<text x="1276" y="570" class="note">for its own task.</text>
<text x="1276" y="600" class="noteh">Links and warnings</text>
<text x="1276" y="618" class="note">link #38bdf8 7.9:1; warning-ink #f59e0b</text>
<text x="1276" y="634" class="note">7.9:1 (the missing-profile lines).</text>
<text x="1276" y="664" class="noteh">Field edges (both themes)</text>
<text x="1276" y="682" class="note">The Input atom's divider border is under 3:1</text>
<text x="1276" y="698" class="note">against the panel in both themes (1.4.11):</text>
<text x="1276" y="714" class="note">app-wide, an open question for the Input</text>
<text x="1276" y="730" class="note">atom, not this design.</text>
</svg>
