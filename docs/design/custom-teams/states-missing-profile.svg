<text x="64" y="944" class="hint">Picking a profile policy.toml has, row by row, clears the line and the offer.</text>

<circle cx="50" cy="174" r="9" class="mark"/><text x="50" y="178" class="num" text-anchor="middle">1</text>
<circle cx="50" cy="218" r="9" class="mark"/><text x="50" y="222" class="num" text-anchor="middle">2</text>
<circle cx="370" cy="628" r="9" class="mark"/><text x="370" y="632" class="num" text-anchor="middle">3</text>

<text x="760" y="140" class="noteh">1 · Said once for the team</text>
<text x="760" y="158" class="note">The client knows the template's profiles and the policy's (/api/policy), so the line</text>
<text x="760" y="174" class="note">under the agents legend counts the agents and names the profiles, before any save.</text>
<text x="760" y="190" class="note">It is a warning, not an error: the team can still be made, by accepting the offer.</text>
<text x="760" y="206" class="note">Warning-ink #96490f on white, 6.5:1, with the triangle icon; never colour alone.</text>
<text x="760" y="236" class="noteh">2 · Closed rows: "profile missing"</text>
<text x="760" y="254" class="note">Beside the name, icon and words, as "1 problem" is for errors. Not counted as a</text>
<text x="760" y="270" class="note">problem, and these rows close normally.</text>
<text x="760" y="300" class="noteh">3 · The open row: AgentForm's own words</text>
<text x="760" y="316" class="note">The select's option and its hint are AgentForm's ("… (missing from policy.toml)",</text>
<text x="760" y="332" class="note">"every call it makes is denied until it's back"), ending with "Create team offers to</text>
<text x="760" y="348" class="note">add it, or pick another." instead of "Add it on the Policy page", since the panel can.</text>
<text x="760" y="364" class="note">Edit team says "Save changes offers to add it". The select's border is warning</text>
<text x="760" y="380" class="note">(#b45309, 5:1).</text>

<!-- ============ B: after the 409 ============ -->
<text x="760" y="432" class="cap">B · CREATE TEAM PRESSED: THE SERVER'S 409, THE OFFER AT THE TOP</text>
<rect x="760" y="444" width="680" height="380" fill="#ffffff" stroke="#cdd1d8"/>
<text x="784" y="484" class="h2">New team</text>
<line x1="760" y1="508" x2="1440" y2="508" class="rule"/>
<rect x="784" y="528" width="632" height="132" rx="3" fill="#e0f0f8" stroke="#9acee9"/>
<rect x="781" y="525" width="638" height="138" rx="4" class="focus"/>
<use href="#info" x="796" y="540"/>
<text x="818" y="552" class="infoh">The Ideas team needs the read-mostly profile, which your policy file</text>
<text x="818" y="570" class="infoh">doesn't have</text>
<text x="818" y="594" class="body">Agentry adds the default text to policy.toml, keeping a backup, then creates</text>
<text x="818" y="612" class="body">the Ideas team.</text>
<rect x="818" y="622" width="262" height="28" rx="3" fill="#fc6d26"/>
<text x="949" y="641" class="pri" text-anchor="middle">Add the profile and create the team</text>
<text x="784" y="692" class="lbl">Team name</text>
<rect x="784" y="700" width="320" height="36" rx="3" class="box"/>
<text x="796" y="723">Ideas</text>
<text x="784" y="770" class="hint">… the rows as in A, everything as you left it …</text>
<line x1="760" y1="790" x2="1440" y2="790" class="rule"/>
<text x="784" y="812" class="hint">Footer: Cancel · Create team, both on.</text>
<circle cx="1430" cy="594" r="9" class="mark"/><text x="1430" y="598" class="num" text-anchor="middle">4</text>

<text x="760" y="856" class="noteh">4 · The existing MissingProfilesOffer, moved to the panel</text>
<text x="760" y="874" class="note">On 409 with missingProfiles the banner takes the summary's place at the top of the body,</text>
<text x="760" y="890" class="note">with focus. Its title is today's ("The {team} team needs {profiles}, which your policy file</text>
<text x="760" y="906" class="note">doesn't have"); body and button end "creates the team" / "saves your changes".</text>
<text x="760" y="922" class="note">The button resends the whole team with addMissingProfiles and the policy hash. If</text>
<text x="760" y="938" class="note">there are field errors too, the error summary comes first and the offer under it: both</text>
<text x="760" y="954" class="note">must be dealt with, and the summary's count doesn't include the profile.</text>
<text x="760" y="970" class="note">Info title in info-ink (5.3:1 on info-soft); today's Banner uses text-info, 3.5:1:</text>
<text x="760" y="986" class="note">see decision 10 in custom-teams.md.</text>

<!-- ============ C: adding ============ -->
<text x="40" y="1036" class="cap">C · THE OFFER ACCEPTED, WHILE IT ADDS</text>
<rect x="40" y="1048" width="680" height="190" fill="#ffffff" stroke="#cdd1d8"/>
<rect x="64" y="1068" width="632" height="132" rx="3" fill="#e0f0f8" stroke="#9acee9"/>
<use href="#info" x="76" y="1080"/>
<text x="98" y="1092" class="infoh">The Ideas team needs the read-mostly profile, which your policy file</text>
<text x="98" y="1110" class="infoh">doesn't have</text>
<text x="98" y="1134" class="body">Agentry adds the default text to policy.toml, keeping a backup, then creates</text>
<text x="98" y="1152" class="body">the Ideas team.</text>
<rect x="98" y="1162" width="236" height="28" rx="3" fill="#f0f1f4" stroke="#cdd1d8"/>
<text x="216" y="1181" class="btn" fill="#6b7280" text-anchor="middle">Adding…</text>
<text x="64" y="1224" class="hint">Create team also shows "Creating…" and is off; fields are read-only (states-saving-error.svg).</text>
<text x="40" y="1274" class="noteh">After it: success as for any Create team (panel closes, toast "Added the Ideas team"). If policy.toml</text>
<text x="40" y="1290" class="note">changed since the panel loaded (hash mismatch), the server says so and the banner turns to the error summary with</text>
<text x="40" y="1306" class="note">its words: "policy.toml changed since you opened this. Check it, then save again." [server] Nothing typed is lost.</text>
</svg>
