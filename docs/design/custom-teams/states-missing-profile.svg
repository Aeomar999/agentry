  .rule { stroke: #e3e5ea; stroke-width: 1; }
  .caret { fill: none; stroke: #424854; stroke-width: 1.5; }
  .trash { fill: none; stroke: #424854; stroke-width: 1.3; }
  .wico { fill: none; stroke: #96490f; stroke-width: 1.4; stroke-linejoin: round; }
  .iico { fill: none; stroke: #0b6798; stroke-width: 1.4; }
  .focus { fill: none; stroke: #d05e27; stroke-width: 2; }
  .mark { fill: #424854; }
</style>
