<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1334" viewBox="0 0 1600 1334" role="img" aria-labelledby="t d">
<title id="t">Missing-profile offer: in a copied row before saving, and the panel's offer after the server's 409</title>
<desc id="d">A: the New team panel copying Visionaries as Ideas. Its agents use the read-mostly profile, which policy.toml lacks: a line under the agents legend says so, collapsed rows say profile missing, and the open row's Policy profile shows read-mostly (missing from policy.toml) with AgentForm's hint. B: after Create team the server refuses with 409; the existing MissingProfilesOffer banner appears at the top of the panel body with focus, offering to add the profile and create the team. C: the offer while adding. Light theme, existing tokens.</desc>
