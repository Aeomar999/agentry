<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1730" viewBox="0 0 1600 1730" role="img" aria-labelledby="t d">
<title id="t">New team panel, desktop: Copy a template, four agents, one open</title>
<desc id="d">The team side panel over the Agents page at /agents?team=new. Copy a template is chosen with Writing; the agents editor, writer, researcher and fact-checker are listed, writer is open showing every field. An inset shows the coordinator's row with an empty prompt using the default coordinator prompt. Light theme, existing tokens.</desc>
<style>
  text { font-family: "IBM Plex Sans", "Noto Sans", sans-serif; font-size: 13px; fill: #1f2329; }
  .h1 { font-size: 22px; font-weight: 700; }
  .h2 { font-size: 17px; font-weight: 700; }
  .sub { fill: #6b7280; }
  .lbl { font-size: 12px; font-weight: 500; fill: #424854; }
  .hint { font-size: 12px; fill: #6b7280; }
  .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12.5px; }
  .ph { fill: #6b7280; font-style: italic; }
  .btn { font-size: 13px; font-weight: 600; }
  .pri { fill: #ffffff; font-size: 13px; font-weight: 600; }
  .link { fill: #0675af; font-size: 12px; text-decoration: underline; }
  .badge { font-size: 11.5px; font-weight: 600; }
  .note { font-size: 12px; fill: #424854; }
  .noteh { font-size: 12px; font-weight: 700; fill: #1f2329; }
  .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
  .box { fill: #ffffff; stroke: #cdd1d8; stroke-width: 1; }
  .rule { stroke: #e3e5ea; stroke-width: 1; }
  .caret { fill: none; stroke: #424854; stroke-width: 1.5; }
  .dot { stroke: none; }
  .gut text { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 12px; fill: #6b7280; }
</style>
<rect width="1600" height="1730" fill="#f6f7f9"/>
<text x="40" y="46" class="h1">New team · desktop · Copy a template</text>
<text x="40" y="72" class="sub">The team panel over /agents (?team=new). Writing copied, renamed Docs; writer open. Words from copy.md.</text>

<!-- the Agents page behind, inert while the panel is open -->
<rect x="40" y="100" width="1200" height="1240" fill="#ffffff" stroke="#cdd1d8"/>
<text x="64" y="140" class="h2">Agents</text>
<text x="64" y="162" class="hint">Teams of agents, one for each kind of work.</text>
<text x="64" y="206" class="h2">Software</text>
<rect x="64" y="222" width="460" height="150" fill="#fafafa" stroke="#e3e5ea"/>
<text x="64" y="404" class="h2">Visionaries</text>
<rect x="64" y="420" width="460" height="120" fill="#fafafa" stroke="#e3e5ea"/>
<!-- flat scrim: no blur, no shadow -->
<rect x="40" y="100" width="520" height="1240" fill="#1f2329" fill-opacity="0.32"/>

<!-- the panel -->
<rect x="560" y="100" width="680" height="1240" fill="#ffffff" stroke="#cdd1d8"/>
<text x="584" y="140" class="h2">New team</text>
