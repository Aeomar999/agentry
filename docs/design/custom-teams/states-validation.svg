<circle cx="50" cy="1154" r="9" class="mark"/><text x="50" y="1158" class="num" text-anchor="middle">6</text>

<text x="760" y="140" class="noteh">1 · The summary takes focus</text>
<text x="760" y="158" class="note">After a failed save the panel body scrolls to its top and focus moves to the summary</text>
<text x="760" y="174" class="note">(tabindex -1, a heading inside it), so a screen reader hears the count and the list.</text>
<text x="760" y="190" class="note">One link per problem, in screen order, each "where: what". A link opens its row if</text>
<text x="760" y="206" class="note">closed and moves focus into the field (B). The summary stays until the next save;</text>
<text x="760" y="222" class="note">a problem fixed meanwhile is struck from it as you leave the field.</text>
<text x="760" y="238" class="note">Colours: title danger-ink on danger-soft 5.9:1; links ink-primary, underlined (the</text>
<text x="760" y="254" class="note">link blue is 4.3:1 on danger-soft, so it is not used here).</text>
<text x="760" y="284" class="noteh">2 · Under each field, in words</text>
<text x="760" y="302" class="note">A danger border (#ef4444, 3.8:1 against white) plus the icon plus the sentence in</text>
<text x="760" y="318" class="note">danger-ink, tied with aria-describedby and aria-invalid. The hint stays under it.</text>
<text x="760" y="334" class="note">The error says what is wrong and what to do; colour is never the only signal.</text>
<text x="760" y="364" class="noteh">3 · No coordinator</text>
<text x="760" y="382" class="note">editor (the coordinator) was removed, so no radio is checked. The error sits under</text>
<text x="760" y="398" class="note">the fieldset's legend, described by the fieldset. Undo on the stub or a radio fixes it.</text>
<text x="760" y="428" class="noteh">4 · Duplicate name inside the team</text>
<text x="760" y="446" class="note">Only the later row is marked, so the agent you meant to keep is left alone.</text>
<text x="760" y="462" class="note">An open row with an error stays open when another row is opened.</text>
<text x="760" y="492" class="noteh">5 · Closed rows count their problems</text>
<text x="760" y="510" class="note">"1 problem" / "2 problems", icon plus text, beside the name; the row's name button</text>
<text x="760" y="526" class="note">reads "reviewer, 1 problem, collapsed". reviewer clashes with Software's reviewer</text>
<text x="760" y="542" class="note">(names are global): "You have an agent called reviewer already, in the Software</text>
<text x="760" y="558" class="note">team. Pick another name."</text>
<text x="760" y="588" class="noteh">6 · The footer repeats the count</text>
<text x="760" y="604" class="note">In text, so it is seen at the bottom too. Create team stays on: pressing it again</text>
<text x="760" y="620" class="note">re-checks and moves focus back to the summary.</text>

<!-- ============ B: following a link ============ -->
<text x="760" y="672" class="cap">B · "fact-checker: policy.toml has no profile…" FOLLOWED</text>
<rect x="760" y="684" width="680" height="226" fill="#ffffff" stroke="#cdd1d8"/>
<rect x="784" y="700" width="632" height="194" class="box"/>
<path d="M798,722 l5,5 l5,-5" class="caret"/>
<circle cx="826" cy="726" r="5" fill="#db2777"/>
<text x="840" y="730" class="mono" font-weight="600">fact-checker</text>
<line x1="785" y1="752" x2="1415" y2="752" class="rule"/>
<text x="804" y="770" class="hint">… Name, Description, Prompt, Colour …</text>
<text x="1104" y="796" class="lbl">Policy profile</text>
<rect x="1104" y="804" width="292" height="36" rx="3" class="bad"/>
<rect x="1101" y="801" width="298" height="42" rx="4" class="focus"/>
<text x="1116" y="827">research-only (not in policy.toml)</text>
<path d="M1376,818 l5,5 l5,-5" class="caret"/>
<use href="#alert" x="1104" y="852"/>
<text x="1122" y="862" class="err">policy.toml has no profile called</text>
<text x="1122" y="878" class="err">research-only. Pick one it has.</text>
<circle cx="1090" cy="822" r="9" class="mark"/><text x="1090" y="826" class="num" text-anchor="middle">7</text>
<text x="760" y="940" class="noteh">7 · Where focus lands</text>
<text x="760" y="958" class="note">The row opens and focus goes to the field itself. The body is its own scroller between</text>
<text x="760" y="974" class="note">header and footer, so no scroll offset is needed. Unknown profile is a name no default</text>
<text x="760" y="990" class="note">profile has (a typo, or a profile since removed), so there is nothing to add for you:</text>
<text x="760" y="1006" class="note">only picking another fixes it. A default profile policy.toml lacks gets the offer</text>
<text x="760" y="1022" class="note">instead (states-missing-profile.svg).</text>

