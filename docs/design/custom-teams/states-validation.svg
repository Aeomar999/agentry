<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img" aria-labelledby="t d">
<title id="t">Validation errors: the error summary, each error by its field, problem counts on closed rows, two coordinators</title>
<desc id="d">A: the New team panel after Create team with five problems. A danger summary at the top of the body has focus and links to each problem: team name taken, no coordinator, a second agent called writer, an agent named reviewer like one in the Software team, and a profile policy.toml lacks. Each error also shows in text under its field, and closed rows show 1 problem. B: following the last link opens fact-checker and focuses its Policy profile with the error under it. C: an existing team that has two coordinators opens in Edit team with no radio checked and the error under the agents legend. Light theme, existing tokens.</desc>
