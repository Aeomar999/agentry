<circle cx="1450" cy="1122" r="9" class="mark"/><text x="1450" y="1126" class="num" text-anchor="middle">8</text>
<text x="760" y="1306" class="noteh">8 · Two coordinators can't be made here, only found</text>
<text x="760" y="1322" class="note">A radio group can't check two, but today's agent form can leave a team with two. The panel opens it with</text>
<text x="760" y="1338" class="note">neither checked, both badged, the error shown at once. The server refuses two the same way.</text>
</svg>
