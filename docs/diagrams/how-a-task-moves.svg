8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="700" rx="8" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="698.5" rx="7.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">How a task moves</text><text x="48" y="114" font-size="15" fill="#62615c">The coordinator hands out each step and reads every report; it can&#x27;t finish until the checks approve the last change.</text><circle cx="600" cy="345" r="72" fill="#d4673f"/><text x="600" y="341" font-size="18" font-weight="700" text-anchor="middle" fill="#ffffff">Coordinator</text><text x="600" y="363" font-size="12.5" text-anchor="middle" fill="#fff1ea">one per team</text><rect x="80" y="170" width="250" height="84" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="98" y="195.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4f8a3c">BUILDS</text><text x="98" y="216.5" font-size="15.5" font-weight="650" fill="#1c1c1b">Engineer</text><text x="98" y="236.5" font-size="12.5" fill="#62615c">writes and commits the change</text><path d="M523.9,307.8 L343.5,247.0" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-clay)"/><path d="M336.5,267.9 L516.9,328.6" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><rect x="413.64720909655944" y="249.72064941652854" width="51.349999999999994" height="22" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.5"/><text x="439.32220909655945" y="264.72064941652854" font-size="11.5" font-weight="600" text-anchor="middle" fill="#d4673f">brief</text><rect x="392.05937697466123" y="303.9301884251736" width="58.019999999999996" height="22" rx="4" fil