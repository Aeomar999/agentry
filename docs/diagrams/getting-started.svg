<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Getting started"><title>Getting started</title><defs><marker id="a-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="790" rx="8" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="788.5" rx="7.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">Getting started</text><text x="48" y="114" font-size="15" fill="#62615c">Unzip it, double-click Start Agentry, and it opens in your browser. You need git and Claude Code.</text><rect x="48" y="150" width="352" height="312" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="68" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">MAC</text><rect x="67" y="209" width="26" height="26" rx="4" fill="#d4673f"/><text x="80" y="226.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><rect x="104" y="190" width="276" height="64" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="122" y="218.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Download the zip</text><text x="122" y="238.0" font-size="12.5" fill="#62615c">agentry-...-mac-apple-silicon.zip</text><rect x="67" y="295" width="26" height="26" rx="4" fill="#d4673f"/><text x="80" y="312.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><rect x="104" y="276" width="276" height="64" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="122" y="304.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Unzip, double-click</text><text x="122" y="324.0" font-size="12.5" fill="#62615c">Start Agentry.command</text><rect x="67" y="387" width="26" height="26" rx="4" fill="#b7840d"/><text x="80" y="404.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><rect x="104" y="362" width="276" height="76" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="122" y="387.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The first time</text><text x="122" y="407.0" font-size="12.5" fill="#62615c">Privacy &amp; Security settings:</text><text x="122" y="425.0" font-size="12.5" fill="#62615c">Open Anyway, then confirm</text><path d="M242,258 V272" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M242,344 V358" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="424" y="150" width="352" height="312" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="444" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">WINDOWS</text><rect x="443" y="209" width="26" height="26" rx="4" fill="#d4673f"/><text x="456" y="226.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><rect x="480" y="190" width="276" height="64" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="498" y="218.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Download the zip</text><text x="498" y="238.0" font-size="12.5" fill="#62615c">agentry-...-windows-x64.zip</text><rect x="443" y="295" width="26" height="26" rx="4" fill="#d4673f"/><text x="456" y="312.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><rect x="480" y="276" width="276" height="64" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="498" y="304.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Unzip, double-click</text><text x="498" y="324.0" font-size="12.5" fill="#62615c">Start Agentry.cmd</text><rect x="443" y="387" width="26" height="26" rx="4" fill="#b7840d"/><text x="456" y="404.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><rect x="480" y="362" width="276" height="76" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="498" y="387.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The first time</text><text x="498" y="407.0" font-size="12.5" fill="#62615c">More info, then Run anyway</text><text x="498" y="425.0" font-size="12.5" fill="#62615c">(it isn&#x27;t signed yet)</text><path d="M618,258 V272" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M618,344 V358" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="800" y="150" width="352" height="312" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="820" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">LINUX</text><rect x="819" y="209" width="26" height="26" rx="4" fill="#d4673f"/><text x="832" y="226.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><rect x="856" y="190" width="276" height="64" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="874" y="218.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Download the zip</text><text x="874" y="238.0" font-size="12.5" fill="#62615c">agentry-...-linux-x64.zip</text><rect x="819" y="295" width="26" height="26" rx="4" fill="#d4673f"/><text x="832" y="312.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><rect x="856" y="276" width="276" height="64" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="874" y="304.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Unzip, double-click</text><text x="874" y="324.0" font-size="12.5" fill="#62615c">start-agentry.sh</text><rect x="819" y="387" width="26" height="26" rx="4" fill="#b7840d"/><text x="832" y="404.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><rect x="856" y="362" width="276" height="76" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="874" y="387.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The first time</text><text x="874" y="407.0" font-size="12.5" fill="#62615c">if it won&#x27;t run:</text><text x="874" y="425.0" font-size="12.5" fill="#62615c">chmod +x the scripts</text><path d="M994,258 V272" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M994,344 V358" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M224,464 V488 H380 V524" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M600,464 V524" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M976,464 V488 H820 V524" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="300" y="528" width="600" height="84" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="318" y="557.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Agentry opens in your browser, signed in</text><text x="318" y="577.0" font-size="12.5" fill="#62615c">It keeps running in the background. Run Start Agentry again</text><text x="318" y="595.0" font-size="12.5" fill="#62615c">to reopen the page; Stop Agentry stops it.</text><line x1="48" y1="642" x2="1152" y2="642" stroke="#dddcd6"/><text x="48" y="672" font-size="11" font-weight="700" text-anchor="start" fill="#93918a">THEN, FROM THE PAGE</text><rect x="48" y="690" width="352" height="76" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="66" y="715.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Add machines</text><text x="66" y="735.0" font-size="12.5" fill="#62615c">Workers: one command to run there,</text><text x="66" y="753.0" font-size="12.5" fill="#62615c">for its system. Agents can run on it.</text><rect x="424" y="690" width="352" height="76" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="442" y="715.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Connect Claude Code</text><text x="442" y="735.0" font-size="12.5" fill="#62615c">Integrations: one command, then</text><text x="442" y="753.0" font-size="12.5" fill="#62615c">plain claude in any repo has Agentry.</text><rect x="800" y="690" width="352" height="76" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.55" stroke-width="1.2"/><text x="818" y="715.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Hand it work</text><text x="818" y="735.0" font-size="12.5" fill="#62615c">New task, or tell Claude at the</text><text x="818" y="753.0" font-size="12.5" fill="#62615c">desk (Ctrl+J) what you want.</text></svg>
