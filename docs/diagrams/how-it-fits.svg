<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How Agentry fits together"><title>How Agentry fits together</title><defs><marker id="a-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="690" rx="8" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="688.5" rx="7.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">How Agentry fits together</text><text x="48" y="114" font-size="15" fill="#62615c">One server keeps the log; you drive it from the browser or Claude Code, and agents work on any machine.</text><rect x="48" y="150" width="250" height="500" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="68" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">YOU</text><rect x="330" y="150" width="520" height="500" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="350" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">AGENTRY SERVER</text><rect x="882" y="150" width="270" height="500" rx="6" fill="#f2f2ef" stroke="#dddcd6" stroke-width="1.2"/><text x="902" y="178" font-size="11" font-weight="700" letter-spacing="1.4" fill="#93918a">MACHINES</text><rect x="68" y="190" width="210" height="84" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="86" y="219.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The page</text><text x="86" y="239.0" font-size="12.5" fill="#62615c">tasks, Plan, Workspace,</text><text x="86" y="257.0" font-size="12.5" fill="#62615c">in any browser</text><rect x="68" y="300" width="210" height="84" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="86" y="329.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Claude Code</text><text x="86" y="349.0" font-size="12.5" fill="#62615c">in any repo, with</text><text x="86" y="367.0" font-size="12.5" fill="#62615c">agentry mcp</text><rect x="350" y="182" width="480" height="62" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.55" stroke-width="1.2"/><text x="368" y="209.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The page and its API</text><text x="368" y="229.0" font-size="12.5" fill="#62615c">everything you see and do</text><path d="M470.0,284 V368 A120.0,14 0 0 0 710.0,368 V284" fill="#ffffff" stroke="#2f8f8f" stroke-width="1.4"/><ellipse cx="590" cy="284" rx="120.0" ry="14" fill="#e4f1f1" stroke="#2f8f8f" stroke-width="1.4"/><text x="590" y="328" font-size="16" font-weight="700" text-anchor="middle" fill="#1c1c1b">The log</text><text x="590" y="347" font-size="12.5" text-anchor="middle" fill="#62615c">every event, append-only</text><text x="590" y="368" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#2f8f8f">agentry.db</text><rect x="350" y="420" width="150" height="84" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="368" y="449.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The gate</text><text x="368" y="469.0" font-size="12.5" fill="#62615c">every action:</text><text x="368" y="487.0" font-size="12.5" fill="#62615c">allow, ask, deny</text><rect x="515" y="420" width="150" height="84" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.55" stroke-width="1.2"/><text x="533" y="449.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Watchdog</text><text x="533" y="469.0" font-size="12.5" fill="#62615c">crashes, stalls,</text><text x="533" y="487.0" font-size="12.5" fill="#62615c">loops</text><rect x="680" y="420" width="150" height="84" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.55" stroke-width="1.2"/><text x="698" y="449.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The loop</text><text x="698" y="469.0" font-size="12.5" fill="#62615c">turns, decisions,</text><text x="698" y="487.0" font-size="12.5" fill="#62615c">checks</text><rect x="350" y="548" width="480" height="64" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.55" stroke-width="1.2"/><text x="368" y="576.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Shared files</text><text x="368" y="596.0" font-size="12.5" fill="#62615c">kept once, by hash, for every machine</text><rect x="902" y="190" width="230" height="96" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="920" y="225.0" font-size="15.5" font-weight="650" fill="#1c1c1b">This machine</text><text x="920" y="245.0" font-size="12.5" fill="#62615c">runs agents too, and</text><text x="920" y="263.0" font-size="12.5" fill="#62615c">keeps the repos</text><rect x="902" y="330" width="230" height="96" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="920" y="365.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Workers</text><text x="920" y="385.0" font-size="12.5" fill="#62615c">Linux, macOS, Windows,</text><text x="920" y="403.0" font-size="12.5" fill="#62615c">each dialling in</text><path d="M282,212 H346" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><path d="M282,342 H312 V230 H346" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><rect x="286.325" y="279" width="51.349999999999994" height="22" rx="4" fill="#ffffff" stroke="#3f7cc0" stroke-opacity="0.5"/><text x="312" y="294" font-size="11.5" font-weight="600" text-anchor="middle" fill="#3f7cc0">tools</text><path d="M590,248 V266" fill="none" stroke="#2f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/><path d="M470,416 V388" fill="none" stroke="#2f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/><path d="M590,416 V388" fill="none" stroke="#2f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/><path d="M700,416 V388" fill="none" stroke="#2f8f8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/><path d="M834,462 H866 V384 H898" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-clay)"/><rect x="840.325" y="415" width="51.349999999999994" height="22" rx="4" fill="#ffffff" stroke="#d4673f" stroke-opacity="0.5"/><text x="866" y="430" font-size="11.5" font-weight="600" text-anchor="middle" fill="#d4673f">turns</text><path d="M1017,430 V526 H425 V508" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><rect x="590.95" y="515" width="218.1" height="22" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.5"/><text x="700" y="530" font-size="11.5" font-weight="600" text-anchor="middle" fill="#b7840d">every action, through its hook</text><path d="M834,580 H1080 V430" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/><rect x="897.64" y="569" width="124.72" height="22" rx="4" fill="#ffffff" stroke="#2f8f8f" stroke-opacity="0.5"/><text x="960" y="584" font-size="11.5" font-weight="600" text-anchor="middle" fill="#2f8f8f">files, both ways</text></svg>
