e" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3d3929" flood-opacity="0.09"/></filter><radialGradient id="hub" cx="40%" cy="35%" r="75%"><stop offset="0%" stop-color="#e8987a"/><stop offset="100%" stop-color="#d97757"/></radialGradient><linearGradient id="logtop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3f1f1"/><stop offset="100%" stop-color="#cfe6e6"/></linearGradient></defs><rect width="1200" height="790" rx="24" fill="#faf9f5"/><rect x="0.75" y="0.75" width="1198.5" height="788.5" rx="23.5" fill="none" stroke="#e5e2d7" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d97757">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1f1e1d" letter-spacing="-0.4">How it fits together</text><text x="48" y="114" font-size="15" fill="#6b6964">One program, one log. Every agent works in its own session and worktree, and every action comes back through the gate.</text><g filter="url(#shadow)"><rect x="60" y="144" width="250" height="70" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="60" y="158" width="4" height="42" rx="2" fill="#5b8fc7"/><text x="82" y="175.0" font-size="15.5" font-weight="650" fill="#1f1e1d">You</text><text x="82" y="195.0" font-size="12.5" fill="#6b6964">in the browser: add, approve, watch</text><rect x="40" y="246" width="784" height="510" rx="20" fill="#f1efe7" stroke="#e5e2d7" stroke-width="1.2"/><text x="62" y="276" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9a978f">AGENTRY SERVE</text><g filter="url(#shadow)"><rect x="72" y="300" width="220" height="80" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="72" y="314" width="4" height="52" rx="2" fill="#5b8fc7"/><text x="94" y="323.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5b8fc7">PAGE + API</text><text x="94" y="344.5" font-size="15.5" font-weight="650" fill="#1f1e1d">The page</text><text x="94" y="364.5" font-size="12.5" fill="#6b6964">tasks, approvals, answers</text><g filter="url(#shadow)"><rect x="72" y="480" width="220" height="80" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="72" y="494" width="4" height="52" rx="2" fill="#5b8fc7"/><text x="94" y="503.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#5b8fc7">TERMINAL</text><text x="94" y="524.5" font-size="15.5" font-weight="650" fill="#1f1e1d">Live terminal</text><text x="94" y="544.5" font-size="12.5" fill="#6b6964">watch, or take control</text><g filter="url(#shadow)"><path d="M332.0,346 V464 A100.0,16 0 0 0 532.0,464 V346" fill="#ffffff" stroke="#3f9a9a" stroke-width="1.4"/></g><ellipse cx="432" cy="346" rx="100.0" ry="16" fill="url(#logtop)" stroke="#3f9a9a" stroke-width="1.4"/><text x="432" y="392" font-size="16" font-weight="700" text-anchor="middle" fill="#1f1e1d">The log</text><text x="432" y="411" font-size="12.5" text-anchor="middle" fill="#6b6964">every event, append-only</text><text x="432" y="434" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#3f9a9a">task.created</text><text x="432" y="450" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#3f9a9a">turn.ended</text><text x="432" y="466" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" fill="#3f9a9a">action.asked</text><g filter="url(#shadow)"><rect x="574" y="300" width="220" height="80" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="574" y="314" width="4" height="52" rx="2" fill="#d97757"/><text x="596" y="323.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#d97757">COORDINATOR LOOP</text><text x="596" y="344.5" font-size="15.5" font-weight="650" fill="#1f1e1d">Does the next step</text><text x="596" y="364.5" font-size="12.5" fill="#6b6964">worktree, turn, decision</text><g filter="url(#shadow)"><rect x="574" y="480" width="220" height="80" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="574" y="494" width="4" height="52" rx="2" fill="#c4503f"/><text x="596" y="503.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#c4503f">WATCHDOG</text><text x="596" y="524.5" font-size="15.5" font-weight="650" fill="#1f1e1d">Watchdog</text><text x="596" y="544.5" font-size="12.5" fill="#6b6964">crashes, silence, loops</text><g filter="url(#shadow)"><rect x="352" y="632" width="220" height="90" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="352" y="646" width="4" height="62" rx="2" fill="#c8921a"/><text x="374" y="660.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#c8921a">THE GATE</text><text x="374" y="681.5" font-size="15.5" font-weight="650" fill="#1f1e1d">Judges every action</text><text x="374" y="701.5" font-size="12.5" fill="#6b6964">allow · ask · deny</text><g filter="url(#shadow)"><path d="M86,636 H274 L292,654 V706 Q292,720 278,720 H86 Q72,720 72,706 V650 Q72,636 86,636 Z" fill="#ffffff" stroke="#e5e2d7"/></g><path d="M274,636 V654 H292" fill="#f1efe7" stroke="#e5e2d7"/><rect x="72" y="650" width="4" height="56" rx="2" fill="#c8921a"/><text x="94" y="676.0" font-size="15" font-weight="650" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#1f1e1d">policy.toml</text><text x="94" y="696.0" font-size="12.5" fill="#6b6964">~/.agentry · your rules</text><rect x="866" y="246" width="294" height="510" rx="20" fill="#f1efe7" stroke="#e5e2d7" stroke-width="1.2"/><text x="888" y="276" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9a978f">ONE TASK</text><g filter="url(#shadow)"><rect x="892" y="300" width="242" height="80" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="892" y="314" wid