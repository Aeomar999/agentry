<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What happens to one action"><title>What happens to one action</title><defs><marker id="arrow-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d97757" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#5b8fc7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#6f8f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c8921a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c4503f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3d3929" flood-opacity="0.09"/></filter><radialGradient id="hub" cx="40%" cy="35%" r="75%"><stop offset="0%" stop-color="#e8987a"/><stop offset="100%" stop-color="#d97757"/></radialGradient><linearGradient id="logtop" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e3f1f1"/><stop offset="100%" stop-color="#cfe6e6"/></linearGradient></defs><rect width="1200" height="900" rx="24" fill="#faf9f5"/><rect x="0.75" y="0.75" width="1198.5" height="898.5" rx="23.5" fill="none" stroke="#e5e2d7" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d97757">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1f1e1d" letter-spacing="-0.4">What happens to one action</text><text x="48" y="114" font-size="15" fill="#6b6964">Anything short of a clear yes blocks it: if Agentry is down, slow or unsure, the gate fails closed.</text><circle cx="376" cy="178.0" r="14" fill="#6f8f4e"/><text x="376" y="182.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><g filter="url(#shadow)"><rect x="410" y="140" width="380" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="410" y="154" width="4" height="48" rx="2" fill="#6f8f4e"/><text x="432" y="174.0" font-size="15.5" font-weight="650" fill="#1f1e1d">An agent wants to act</text><text x="432" y="194.0" font-size="12.5" fill="#6b6964">run a command, edit a file, fetch a page</text><path d="M600.0,216 V256" fill="none" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><circle cx="376" cy="294.0" r="14" fill="#c8921a"/><text x="376" y="298.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><g filter="url(#shadow)"><rect x="410" y="256" width="380" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="410" y="270" width="4" height="48" rx="2" fill="#c8921a"/><text x="432" y="290.0" font-size="15.5" font-weight="650" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#1f1e1d">agentry hook</text><text x="432" y="310.0" font-size="12.5" fill="#6b6964">the engine calls it, before anything runs</text><path d="M600.0,332 V372" fill="none" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><circle cx="376" cy="410.0" r="14" fill="#3f9a9a"/><text x="376" y="414.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><g filter="url(#shadow)"><rect x="410" y="372" width="380" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="410" y="386" width="4" height="48" rx="2" fill="#3f9a9a"/><text x="432" y="406.0" font-size="15.5" font-weight="650" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#1f1e1d">action.requested</text><text x="432" y="426.0" font-size="12.5" fill="#6b6964">recorded in the log</text><path d="M600.0,448 V488" fill="none" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><circle cx="376" cy="526.0" r="14" fill="#c4503f"/><text x="376" y="530.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><g filter="url(#shadow)"><rect x="410" y="488" width="380" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="410" y="502" width="4" height="48" rx="2" fill="#c4503f"/><text x="432" y="522.0" font-size="15.5" font-weight="650" fill="#1f1e1d">Agentry&#x27;s own files?</text><text x="432" y="542.0" font-size="12.5" fill="#6b6964">the policy, the log, the sign-in token</text><path d="M600.0,564 V604" fill="none" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><circle cx="376" cy="642.0" r="14" fill="#c8921a"/><text x="376" y="646.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><g filter="url(#shadow)"><rect x="410" y="604" width="380" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="410" y="618" width="4" height="48" rx="2" fill="#c8921a"/><text x="432" y="638.0" font-size="15.5" font-weight="650" fill="#1f1e1d">The agent&#x27;s profile</text><text x="432" y="658.0" font-size="12.5" fill="#6b6964">in policy.toml: the first matching rule decides</text><g filter="url(#shadow)"><rect x="890" y="256" width="270" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="890" y="270" width="4" height="48" rx="2" fill="#c4503f"/><text x="912" y="290.0" font-size="15.5" font-weight="650" fill="#1f1e1d">Blocked</text><text x="912" y="310.0" font-size="12.5" fill="#6b6964">no answer before the hook&#x27;s own deadline</text><rect x="1058.92" y="268" width="89.08" height="20" rx="10" fill="#c4503f" fill-opacity="0.12"/><text x="1103.46" y="282" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c4503f">fails closed</text><path d="M790,294 H890" fill="none" stroke="#c4503f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><rect x="799.985" y="283" width="80.03" height="22" rx="11" fill="#ffffff" stroke="#c4503f" stroke-opacity="0.45"/><text x="840.0" y="298" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c4503f">no answer</text><g filter="url(#shadow)"><rect x="890" y="488" width="270" height="76" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="890" y="502" width="4" height="48" rx="2" fill="#c4503f"/><text x="912" y="522.0" font-size="15.5" font-weight="650" fill="#1f1e1d">Refused</text><text x="912" y="542.0" font-size="12.5" fill="#6b6964">built in, whatever the policy says</text><rect x="1095.46" y="500" width="52.54" height="20" rx="10" fill="#c4503f" fill-opacity="0.12"/><text x="1121.73" y="514" font-size="10.5" font-weight="700" text-anchor="middle" fill="#c4503f">always</text><path d="M790,526 H890" fill="none" stroke="#c4503f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><rect x="819.995" y="515" width="40.01" height="22" rx="11" fill="#ffffff" stroke="#c4503f" stroke-opacity="0.45"/><text x="840.0" y="530" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c4503f">yes</text><path d="M600.0,680 V716" fill="none" stroke="#9a978f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><g filter="url(#shadow)"><rect x="110" y="752" width="300" height="104" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="110" y="766" width="4" height="76" rx="2" fill="#6f8f4e"/><text x="132" y="787.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6f8f4e">ALLOW</text><text x="132" y="808.5" font-size="15.5" font-weight="650" fill="#1f1e1d">It runs</text><text x="132" y="828.5" font-size="12.5" fill="#6b6964">its result is logged</text><path d="M600.0,716 H268.0 Q260.0,716 260.0,724 V752" fill="none" stroke="#6f8f4e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><rect x="403.325" y="705" width="53.349999999999994" height="22" rx="11" fill="#ffffff" stroke="#6f8f4e" stroke-opacity="0.45"/><text x="430.0" y="720" font-size="11.5" font-weight="600" text-anchor="middle" fill="#6f8f4e">allow</text><g filter="url(#shadow)"><rect x="450" y="752" width="300" height="104" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="450" y="766" width="4" height="76" rx="2" fill="#c8921a"/><text x="472" y="778.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#c8921a">ASK</text><text x="472" y="799.5" font-size="15.5" font-weight="650" fill="#1f1e1d">Needs you on the page</text><text x="472" y="819.5" font-size="12.5" fill="#6b6964">approve: it runs</text><text x="472" y="837.5" font-size="12.5" fill="#6b6964">deny or no answer: refused</text><path d="M600.0,716 V752" fill="none" stroke="#c8921a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><rect x="579.995" y="723" width="40.01" height="22" rx="11" fill="#ffffff" stroke="#c8921a" stroke-opacity="0.45"/><text x="600.0" y="738" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c8921a">ask</text><g filter="url(#shadow)"><rect x="790" y="752" width="300" height="104" rx="14" fill="#ffffff" stroke="#e5e2d7" stroke-width="1"/></g><rect x="790" y="766" width="4" height="76" rx="2" fill="#c4503f"/><text x="812" y="778.5" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#c4503f">DENY</text><text x="812" y="799.5" font-size="15.5" font-weight="650" fill="#1f1e1d">Refused</text><text x="812" y="819.5" font-size="12.5" fill="#6b6964">the agent is told the rule</text><text x="812" y="837.5" font-size="12.5" fill="#6b6964">and why, so it can adapt</text><path d="M600.0,716 H932.0 Q940.0,716 940.0,724 V752" fill="none" stroke="#c4503f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><rect x="746.66" y="705" width="46.68" height="22" rx="11" fill="#ffffff" stroke="#c4503f" stroke-opacity="0.45"/><text x="770.0" y="720" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c4503f">deny</text></svg>
