<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What happens to one action"><title>What happens to one action</title><defs><marker id="a-clay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#d4673f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3f7cc0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#2f8f8f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="760" rx="8" fill="#fafaf8"/><rect x="0.75" y="0.75" width="1198.5" height="758.5" rx="7.5" fill="none" stroke="#dddcd6" stroke-width="1.5"/><text x="48" y="54" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#d4673f">AGENTRY</text><text x="48" y="86" font-size="27" font-weight="700" fill="#1c1c1b" letter-spacing="-0.4">What happens to one action</text><text x="48" y="114" font-size="15" fill="#62615c">Before anything runs, it passes four checks, and every way out that isn&#x27;t a clear yes blocks it.</text><rect x="337" y="175" width="26" height="26" rx="4" fill="#d4673f"/><text x="350" y="192.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><rect x="380" y="150" width="440" height="76" rx="4" fill="#ffffff" stroke="#93918a" stroke-opacity="0.55" stroke-width="1.2"/><text x="398" y="184.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The engine calls agentry hook</text><text x="398" y="204.0" font-size="12.5" fill="#62615c">before every command, edit or fetch</text><path d="M600,230 V258" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="337" y="287" width="26" height="26" rx="4" fill="#d4673f"/><text x="350" y="304.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><rect x="380" y="262" width="440" height="76" rx="4" fill="#ffffff" stroke="#93918a" stroke-opacity="0.55" stroke-width="1.2"/><text x="398" y="296.0" font-size="15.5" font-weight="650" fill="#1c1c1b">It is recorded in the log</text><text x="398" y="316.0" font-size="12.5" fill="#62615c">the action, then what was decided</text><path d="M600,342 V370" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="337" y="399" width="26" height="26" rx="4" fill="#d4673f"/><text x="350" y="416.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><rect x="380" y="374" width="440" height="76" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="398" y="408.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Built-in protection</text><text x="398" y="428.0" font-size="12.5" fill="#62615c">no agent touches the policy, the log or the tokens</text><path d="M600,454 V482" fill="none" stroke="#93918a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><rect x="337" y="511" width="26" height="26" rx="4" fill="#d4673f"/><text x="350" y="528.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><rect x="380" y="486" width="440" height="76" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="398" y="520.0" font-size="15.5" font-weight="650" fill="#1c1c1b">The agent&#x27;s profile</text><text x="398" y="540.0" font-size="12.5" fill="#62615c">its rules, top to bottom: the first match decides</text><rect x="960" y="150" width="192" height="76" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.55" stroke-width="1.2"/><text x="978" y="184.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Denied</text><text x="978" y="204.0" font-size="12.5" fill="#62615c">the gate fails closed</text><path d="M824,188 H956" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><rect x="844.315" y="177" width="91.36999999999999" height="22" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.5"/><text x="890" y="192" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c0442f">server down</text><rect x="960" y="374" width="192" height="76" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.55" stroke-width="1.2"/><text x="978" y="408.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Denied</text><text x="978" y="428.0" font-size="12.5" fill="#62615c">whatever the file says</text><path d="M824,412 H956" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><rect x="840.98" y="401" width="98.03999999999999" height="22" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.5"/><text x="890" y="416" font-size="11.5" font-weight="600" text-anchor="middle" fill="#c0442f">touches them</text><path d="M600,566 V594" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,594 H920" fill="none" stroke="#93918a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,594 V630" fill="none" stroke="#4f8a3c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><path d="M600,594 V630" fill="none" stroke="#b7840d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-amber)"/><path d="M920,594 V630" fill="none" stroke="#c0442f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><rect x="150" y="634" width="260" height="84" rx="4" fill="#ffffff" stroke="#4f8a3c" stroke-opacity="0.55" stroke-width="1.2"/><text x="168" y="672.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Allow</text><text x="168" y="692.0" font-size="12.5" fill="#62615c">it runs</text><rect x="470" y="634" width="260" height="84" rx="4" fill="#ffffff" stroke="#b7840d" stroke-opacity="0.55" stroke-width="1.2"/><text x="488" y="663.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Ask you</text><text x="488" y="683.0" font-size="12.5" fill="#62615c">it waits: on the page,</text><text x="488" y="701.0" font-size="12.5" fill="#62615c">or Claude Code asks you</text><rect x="790" y="634" width="260" height="84" rx="4" fill="#ffffff" stroke="#c0442f" stroke-opacity="0.55" stroke-width="1.2"/><text x="808" y="663.0" font-size="15.5" font-weight="650" fill="#1c1c1b">Deny</text><text x="808" y="683.0" font-size="12.5" fill="#62615c">refused, with the</text><text x="808" y="701.0" font-size="12.5" fill="#62615c">rule&#x27;s why</text></svg>
